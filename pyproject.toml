[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse-agent"
version = "0.1.0"
description = "Reverse-agent governance and tooling package"
requires-python = ">=3.13"
dependencies = ["pytest"]

[project.optional-dependencies]
console = ["requests>=2.32.0"]

[tool.setuptools.packages.find]
include = ["reverse_agent*"]
exclude = ["tests*", "project_state*", "docs*"]
