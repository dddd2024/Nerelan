model_list:
  - model_name: unattended-v0
    litellm_params:
      model: openai/provider-free-runtime-proof
      api_base: http://provider-free-llm-fixture:9000/v1
      api_key: os.environ/PROVIDER_FREE_FIXTURE_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_spend_logs: false

litellm_settings:
  redact_user_api_key_info: true
  turn_off_message_logging: true
