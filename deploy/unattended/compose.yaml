services:
  postgresql:
    image: docker.io/library/postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - temporal-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    networks: [control]

  temporal-schema:
    image: docker.io/temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgresql
      SQL_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./temporal/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["tr -d '\\r' < /scripts/setup-postgres.sh | /bin/sh"]
    restart: "no"
    networks: [control]

  temporal:
    image: docker.io/temporalio/server:1.31.2@sha256:b5ecdb8282bededae2a10c36e8d862e27d0bc2d247fc73c5416025997ab4a1da
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgresql
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "${UNATTENDED_BIND_ADDRESS:-127.0.0.1}:7233:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
      - temporal-server-data:/var/temporal
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    networks: [control]

  temporal-namespace:
    image: docker.io/temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./temporal/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["tr -d '\\r' < /scripts/ensure-default-namespace.sh | /bin/sh"]
    restart: "no"
    networks: [control]

  temporal-admin-tools:
    image: docker.io/temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["/bin/sh", "-c"]
    command: ["temporal operator namespace describe --namespace default >/dev/null && exec tail -f /dev/null"]
    healthcheck:
      test: ["CMD-SHELL", "temporal operator namespace describe --namespace default >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [control]

  reverse-agent-worker:
    profiles: [runtime-proof]
    image: reverse-agent-unattended-worker:issue82
    build:
      context: ../..
      dockerfile: deploy/unattended/worker.Dockerfile
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    command: [reverse_agent.unattended.worker]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [control]

  sandbox-controller-worker:
    profiles: [runtime-proof]
    image: reverse-agent-unattended-worker:issue82
    build:
      context: ../..
      dockerfile: deploy/unattended/worker.Dockerfile
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    command: [reverse_agent.unattended.controller_worker]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      UNATTENDED_HOST_WORKSPACE_ROOT: ${UNATTENDED_HOST_WORKSPACE_ROOT:-/tmp/reverse-agent-unattended-attempts}
      UNATTENDED_EXECUTOR_NETWORK: ${COMPOSE_PROJECT_NAME:-reverse-agent-unattended}_model-executor
      UNATTENDED_LITELLM_EXECUTOR_KEY_FILE: /run/secrets/litellm_executor_key
    secrets:
      - source: litellm_executor_key
        target: litellm_executor_key
        mode: 0400
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${UNATTENDED_HOST_WORKSPACE_ROOT:-/tmp/reverse-agent-unattended-attempts}
        target: ${UNATTENDED_HOST_WORKSPACE_ROOT:-/tmp/reverse-agent-unattended-attempts}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [control]

  temporal-ui:
    image: docker.io/temporalio/ui:2.52.1@sha256:b839b5c798770896c78058db1647d325a19b3acef7fa1fbd9a23fabb1dd7feb2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${UNATTENDED_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [control]

  litellm-database:
    image: docker.io/library/postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LITELLM_DATABASE_PASSWORD: ${LITELLM_DATABASE_PASSWORD}
    volumes:
      - ./postgres:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["tr -d '\\r' < /scripts/ensure-litellm-database.sh | /bin/sh"]
    restart: "no"
    networks: [control]

  litellm:
    image: ghcr.io/berriai/litellm:v1.94.0@sha256:65d84a2282137b4dc73bbe184650a7c807177c533e4223b3bfbc87963fe3fabe
    entrypoint: ["/bin/sh", "-c"]
    command: ["tr -d '\\r' < /app/litellm-entrypoint.sh | /bin/sh"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DATABASE_PASSWORD}@postgresql:5432/litellm
    depends_on:
      litellm-database:
        condition: service_completed_successfully
    secrets:
      - source: openai_api_key
        target: openai_api_key
        mode: 0400
    volumes:
      - ./litellm.config.example.yaml:/app/config.yaml:ro
      - ./litellm-entrypoint.sh:/app/litellm-entrypoint.sh:ro
    ports:
      - "${UNATTENDED_BIND_ADDRESS:-127.0.0.1}:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      control:
      model-executor:
        aliases: [litellm-executor]

  litellm-key-bootstrap:
    image: ghcr.io/berriai/litellm:v1.94.0@sha256:65d84a2282137b4dc73bbe184650a7c807177c533e4223b3bfbc87963fe3fabe
    depends_on:
      litellm:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    secrets:
      - source: litellm_executor_key
        target: litellm_executor_key
        mode: 0400
    volumes:
      - ./litellm-key-bootstrap.py:/app/litellm-key-bootstrap.py:ro
    entrypoint: ["python", "/app/litellm-key-bootstrap.py"]
    restart: "no"
    networks: [control]

  agent-canvas:
    image: ghcr.io/openhands/agent-canvas:1.6.1@sha256:98203471b02490b3c5bea8e9525c883519a794c5695989c8ba18c284d11d002d
    depends_on:
      litellm-key-bootstrap:
        condition: service_completed_successfully
    environment:
      VITE_BACKEND_HOST: http://localhost:8000
    ports:
      - "${UNATTENDED_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    networks: [control]

networks:
  control:
    driver: bridge
  model-executor:
    driver: bridge
    internal: true

volumes:
  temporal-postgresql-data:
  temporal-server-data:

secrets:
  openai_api_key:
    file: ${UNATTENDED_OPENAI_API_KEY_FILE:-/tmp/reverse-agent-missing-openai-api-key}
  litellm_executor_key:
    file: ${UNATTENDED_LITELLM_EXECUTOR_KEY_FILE:-/tmp/reverse-agent-missing-litellm-executor-key}
