name: Windows Platform V1

on:
  push:
    branches:
      - main
    paths:
      - "launch_reverse_agent.bat"
      - "dev-up.ps1"
      - "dev-down.ps1"
      - "tests/platform_v1/test_dev_up_contract.py"
      - ".github/workflows/windows-platform-v1.yml"
  pull_request:
    paths:
      - "launch_reverse_agent.bat"
      - "dev-up.ps1"
      - "dev-down.ps1"
      - "tests/platform_v1/test_dev_up_contract.py"
      - ".github/workflows/windows-platform-v1.yml"

permissions:
  contents: read

jobs:
  windows-launcher-lifecycle-proof:
    name: Windows launcher/lifecycle proof
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package test extras
        shell: pwsh
        run: python -m pip install -e ".[test]"

      - name: Windows launcher/lifecycle contract
        shell: pwsh
        run: python -m pytest tests/platform_v1/test_dev_up_contract.py -q
