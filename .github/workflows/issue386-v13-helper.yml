name: Issue 386 V13 transport helper
on:
  push:
    branches: [owner/issue386-executor-router-collision-r1-v13-helper]
permissions:
  contents: write
jobs:
  prepare:
    if: "${{ github.actor == 'dddd2024' && github.event.head_commit.message == 'chore: install Issue 386 V13 transport helper' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner/issue386-executor-router-collision-r1-v13-helper
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Apply byte-preserving bounded patch
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Focused ExecutorRouter tests
        run: python -m pytest tests/platform_v1/test_task_runtime.py -q
      - name: Intentional fixture caller tests
        run: python -m pytest tests/platform_v1/test_durable_execution.py tests/platform_v1/test_task_service.py tests/platform_v1/test_unattended_coordinator.py -q
      - name: Diff check before candidate commit
        run: git diff --check
      - name: Remove helper and verify net product tree
        run: |
          git rm .github/workflows/issue386-v13-helper.yml
          python -c "import base64;exec(base64.b64decode(''))"
      - name: Form clean local five-path candidate commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare Issue 386 V13 product tree"
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only 0da78df5d2c5337ffeab17e3a00651df507637f0 HEAD | wc -l)" -eq 5
          test -z "$(git diff --name-only 0da78df5d2c5337ffeab17e3a00651df507637f0 HEAD -- .github/workflows/)"
      - name: Platform V1 blocking suite on clean candidate head
        run: python -m pytest tests/platform_v1 -q --deselect=tests/platform_v1/test_task3c_v6_production_relay.py::TestCombinedTrustedHostInstalledOpenCodeE2E::test_real_task_api_opencode_relay_fake_provider_end_to_end --deselect=tests/platform_v1/test_task3c_v4_repairs.py::TestInstalledOpenCodeFakeProviderSmoke::test_installed_opencode_fake_provider_end_to_end --deselect=tests/platform_v1/test_task3c_v5_opencode_probe.py::TestDirectFakeProviderControl::test_opencode_direct_fake_provider --deselect=tests/platform_v1/test_task3c_v5_opencode_probe.py::TestRelayFakeProviderRun::test_opencode_relay_fake_provider
      - name: Publish already-tested helper candidate
        run: git push origin HEAD:owner/issue386-executor-router-collision-r1-v13-helper
