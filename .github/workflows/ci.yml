name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Import check
        run: python -c "import reverse_agent.project_gate; import reverse_agent.project_state; import reverse_agent.post_final_evidence_sync; import reverse_agent.decision_preflight"

      - name: Full test suite
        timeout-minutes: 25
        run: python -m pytest -q

      - name: Unattended unit tests
        run: python -m pytest tests/unattended/unit -q

      - name: Validate unattended Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
          OH_SESSION_API_KEYS_0: ci-only-placeholder
          OH_SECRET_KEY: ci-only-placeholder
          LITELLM_MASTER_KEY: ci-only-placeholder
          LITELLM_SALT_KEY: ci-only-placeholder
          OPENAI_API_KEY: not-a-provider-credential
        run: docker compose -f deploy/unattended/compose.yaml config --quiet

      - name: Unattended doctor
        run: python -m reverse_agent.unattended.cli doctor
