name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {"fetch-depth": 0, "fetch-tags": true, "persist-credentials": false}

      - id: credential_hygiene
        shell: bash
        run: |
          set -eu
          python - <<'PY'
          import re
          import subprocess
          import sys

          token_material = re.compile(
              r"(?i)(?:"
              r"gh[pousr]_[A-Za-z0-9_]+|"
              r"x-access-token|oauth2:|"
              r"://[^/\s:@]+:[^@\s]+@|"
              r"://[^/@\s]+@"
              r")"
          )

          def fail(category: str) -> None:
              print(f"::error::git credential hygiene failed: {category}")
              raise SystemExit(1)

          def entries(scope: str) -> list[tuple[str, str]]:
              completed = subprocess.run(
                  [
                      "git",
                      "config",
                      "--includes",
                      scope,
                      "--null",
                      "--list",
                  ],
                  check=False,
                  capture_output=True,
              )
              if completed.returncode not in {0, 1}:
                  fail(f"{scope[2:]}_config_unreadable")
              parsed: list[tuple[str, str]] = []
              for raw in completed.stdout.split(b"\0"):
                  if not raw:
                      continue
                  key, separator, value = raw.partition(b"\n")
                  if not separator:
                      value = b""
                  parsed.append(
                      (
                          key.decode("utf-8", "surrogateescape"),
                          value.decode("utf-8", "surrogateescape"),
                      )
                  )
              return parsed

          effective: list[tuple[str, str]] = []
          for selected_scope in ("--system", "--global", "--local"):
              effective.extend(entries(selected_scope))

          for key, value in effective:
              lowered = key.lower()
              combined = f"{key}\n{value}"
              if lowered.startswith("http.") and lowered.endswith(".extraheader"):
                  fail("authorization_extraheader")
              if lowered == "credential.helper":
                  fail("credential_helper")
              if lowered.startswith("url.") and lowered.endswith(".insteadof"):
                  if token_material.search(combined):
                      fail("credential_bearing_insteadof")
              if lowered == "core.sshcommand" or (
                  lowered.startswith("remote.") and lowered.endswith(".sshcommand")
              ):
                  fail("credential_bearing_ssh_command")
              if lowered.startswith("remote.") and lowered.endswith(".url"):
                  if token_material.search(combined):
                      fail("token_bearing_remote")
              if token_material.search(combined):
                  fail("token_bearing_effective_config")

          remotes = subprocess.run(
              ["git", "remote"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          for remote in remotes:
              resolved = subprocess.run(
                  ["git", "remote", "get-url", "--all", remote],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              if token_material.search(resolved):
                  fail("token_bearing_resolved_remote")

          git_dir = subprocess.run(
              ["git", "rev-parse", "--git-dir"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if token_material.search(git_dir):
              fail("credential_bearing_git_dir")

          print("credential_hygiene=PASS")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Import check
        timeout-minutes: 25
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
          LITELLM_DATABASE_PASSWORD: ci_only_placeholder
          LITELLM_MASTER_KEY: ci-only-placeholder
          LITELLM_SALT_KEY: ci-only-placeholder
          GIT_AUTHOR_NAME: reverse-agent-ci
          GIT_AUTHOR_EMAIL: reverse-agent-ci@invalid
          GIT_COMMITTER_NAME: reverse-agent-ci
          GIT_COMMITTER_EMAIL: reverse-agent-ci@invalid
        run: |
          python -c "import reverse_agent.project_gate; import reverse_agent.project_state; import reverse_agent.post_final_evidence_sync; import reverse_agent.decision_preflight"
          mkdir -p "$HOME/.config/powershell"
          printf '%s\n' '$PSDefaultParameterValues["Get-Item:Force"] = $true' > "$HOME/.config/powershell/Microsoft.PowerShell_profile.ps1"
          mkdir -p 'E:\reverse/逆向课程2024春01' 'E:\reverse/逆向课程2022春02'
          touch 'E:\reverse/逆向课程2024春01/sha_256.exe' 'E:\reverse/逆向课程2022春02/CPP2.exe'
          echo "::group::Full test suite"
          python -m pytest -q
          echo "::endgroup::"
          echo "::group::Unattended unit tests"
          python -m pytest tests/unattended/unit -q
          echo "::endgroup::"
          echo "::group::Unattended Compose configuration"
          docker compose -f deploy/unattended/compose.yaml config --quiet
          echo "::endgroup::"
          echo "::group::Unattended doctor"
          python -m reverse_agent.unattended.cli doctor
          echo "::endgroup::"

      - name: Focused tests
        run: python -m pytest tests/test_project_gate.py tests/test_project_reports.py tests/test_project_jobs.py tests/test_post_final_evidence_sync.py tests/test_decision_preflight.py tests/test_project_state.py tests/test_control_plane_transition.py tests/test_architecture_contracts.py tests/test_risk_classifier.py tests/test_development_graph.py tests/test_trust_authorization_adapter.py tests/test_planning_and_github_adapters.py -q
