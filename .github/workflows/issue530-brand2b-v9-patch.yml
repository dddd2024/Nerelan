name: BRAND-2B v9 one-time branch patch

on:
  push:
    branches:
      - owner/issue530-brand2b-validation-r3-v9

permissions:
  contents: write

jobs:
  apply-brand2b-v9:
    if: github.repository == 'dddd2024/Nerelan' && github.ref == 'refs/heads/owner/issue530-brand2b-validation-r3-v9'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact v9 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: owner/issue530-brand2b-validation-r3-v9

      - name: Verify immutable v9 authority and locked ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "owner/issue530-brand2b-validation-r3-v9"
          git merge-base --is-ancestor 0feeb3f35ef164591678caba96fb46477b366f52 HEAD
          grep -Fq 'decision_20260901_issue530_brand2b_validation_r3_v9' project_state/decision_packet.md
          test "$(git rev-list --count 0feeb3f35ef164591678caba96fb46477b366f52..HEAD)" -eq 3

      - name: Replay reviewed v8 product blobs only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/owner/issue530-brand2b-validation-r3-v8:refs/remotes/origin/brand2b-v8-source
          test "$(git rev-parse refs/remotes/origin/brand2b-v8-source)" = "2ac33e1d67ec0055bf2a650ebe147e6dec4beb71"
          git checkout 2ac33e1d67ec0055bf2a650ebe147e6dec4beb71 -- \
            project_state/schemas/mainline_merge_intent_v4.schema.json \
            project_state/schemas/merge_approval_attestation_v4.schema.json \
            reverse_agent/mainline_landing.py \
            reverse_agent/platform_v1/goal_service.py \
            reverse_agent/platform_v1/inbox_service.py \
            frontend/src/components/goal-composer.tsx \
            frontend/src/lib/profile-mapper.ts \
            README.txt \
            reverse_agent/platform_v1/run_store.py \
            reverse_agent/platform_v1/control_store.py \
            reverse_agent/platform_v1/task_service.py \
            frontend/src/lib/platform-client.ts \
            AGENTS.md \
            docs/supervisor/audit-instructions.md \
            scripts/supervisor_validate.py \
            scripts/supervisor_publish.py \
            tests/test_project_gate.py \
            frontend/tests/compact-goal-composer.test.tsx \
            tests/platform_v1/test_publication_controller.py \
            tests/platform_v1/test_unattended_coordinator.py \
            tests/platform_v1/test_run_read_model.py

      - name: Bind current schema-v4 test to existing v4 helpers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("tests/test_project_gate.py")
          text = p.read_text(encoding="utf-8")
          target = "test_v4_exact_schema4_intent_event_remote_pr_and_attestation_pass"
          marker = f"def {target}"
          start = text.find(marker)
          if start < 0:
              raise SystemExit("v9_target_test_missing")
          next_def = text.find("\ndef test_", start + len(marker))
          end = len(text) if next_def < 0 else next_def + 1
          block = text[start:end]
          if block.count("_v3_landing_fixture(tmp_path)") != 1:
              raise SystemExit("v9_expected_one_v3_fixture_call")
          if block.count("_run_v3_landing_preflight(fx, tmp_path, monkeypatch)") != 1:
              raise SystemExit("v9_expected_one_v3_preflight_call")

          defs = re.findall(r"^def\s+([A-Za-z_]\w*)\s*\(", text, flags=re.MULTILINE)
          v4_landing = sorted(n for n in defs if "v4" in n.lower() and "landing" in n.lower())
          fixtures = [n for n in v4_landing if "fixture" in n.lower()]
          preflights = [n for n in v4_landing if "preflight" in n.lower()]
          print("v4_landing_helpers=", v4_landing)
          print("fixture_candidates=", fixtures)
          print("preflight_candidates=", preflights)
          if len(fixtures) != 1 or len(preflights) != 1:
              raise SystemExit(
                  f"v9_unique_v4_helpers_required:fixtures={fixtures}:preflights={preflights}"
              )
          fixture, preflight = fixtures[0], preflights[0]
          block = block.replace("_v3_landing_fixture(tmp_path)", f"{fixture}(tmp_path)", 1)
          block = block.replace(
              "_run_v3_landing_preflight(fx, tmp_path, monkeypatch)",
              f"{preflight}(fx, tmp_path, monkeypatch)",
              1,
          )
          if "_v3_landing_fixture(tmp_path)" in block or "_run_v3_landing_preflight" in block:
              raise SystemExit("v9_v3_binding_remains_in_current_test")
          text = text[:start] + block + text[end:]
          p.write_text(text, encoding="utf-8")
          print(f"bound current v4 test to fixture={fixture} preflight={preflight}")
          PY

      - name: Prove final path scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue530-brand2b-v9-patch.yml
          test ! -e .github/workflows/issue530-brand2b-v9-patch.yml
          python - <<'PY'
          import subprocess
          allowed = {
              "project_state/decision_packet.md",
              "project_state/gates/command_plan.json",
              "project_state/schemas/mainline_merge_intent_v4.schema.json",
              "project_state/schemas/merge_approval_attestation_v4.schema.json",
              "reverse_agent/mainline_landing.py",
              "reverse_agent/platform_v1/goal_service.py",
              "reverse_agent/platform_v1/inbox_service.py",
              "frontend/src/components/goal-composer.tsx",
              "frontend/src/lib/profile-mapper.ts",
              "README.txt",
              "reverse_agent/platform_v1/run_store.py",
              "reverse_agent/platform_v1/control_store.py",
              "reverse_agent/platform_v1/task_service.py",
              "frontend/src/lib/platform-client.ts",
              "AGENTS.md",
              "docs/supervisor/audit-instructions.md",
              "scripts/supervisor_validate.py",
              "scripts/supervisor_publish.py",
              "tests/test_project_gate.py",
              "frontend/tests/compact-goal-composer.test.tsx",
              "tests/platform_v1/test_publication_controller.py",
              "tests/platform_v1/test_unattended_coordinator.py",
              "tests/platform_v1/test_run_read_model.py",
          }
          out = subprocess.check_output([
              "git", "diff", "--name-only",
              "0feeb3f35ef164591678caba96fb46477b366f52",
          ], text=True)
          changed = {line.strip() for line in out.splitlines() if line.strip()}
          outside = sorted(changed - allowed)
          required = allowed - {"project_state/decision_packet.md", "project_state/gates/command_plan.json"}
          missing = sorted(required - changed)
          print("changed=", sorted(changed))
          print("outside=", outside)
          print("missing=", missing)
          if outside or missing:
              raise SystemExit(1)
          PY

      - name: Commit and push one implementation commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "BRAND-2B: bind current schema-v4 landing helpers"
          test "$(git rev-list --count 0feeb3f35ef164591678caba96fb46477b366f52..HEAD)" -eq 4
          git push origin HEAD:owner/issue530-brand2b-validation-r3-v9
