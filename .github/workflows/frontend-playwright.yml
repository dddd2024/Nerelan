name: Frontend Playwright

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-playwright.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-playwright.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install bundled Chromium
        working-directory: frontend
        run: npx playwright install --with-deps --no-shell chromium

      - name: Run Playwright
        working-directory: frontend
        run: npm run e2e
        env:
          CI: "true"

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-results
          if-no-files-found: warn
          path: |
            frontend/test-results
            frontend/playwright-report
