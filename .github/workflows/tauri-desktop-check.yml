name: Tauri Desktop Check

# Trigger paths are deliberately limited to frontend product paths.
# The workflow's own YAML path is intentionally excluded so this workflow can
# never self-trigger on its own change, and no manual, scheduled, or
# reusable-call trigger surface is declared.

on:
  push:
    branches:
      - main
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src-tauri/**"
  pull_request:
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src-tauri/**"

permissions:
  contents: read

jobs:
  tauri-desktop-check:
    name: Tauri desktop compile/check
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: frontend
        run: npm ci

      - name: Pin Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup default 1.98.0
          rustc --version
          cargo --version

      - name: Tauri environment info
        shell: pwsh
        run: npm --prefix frontend run tauri -- info

      - name: Cargo locked check
        shell: pwsh
        run: cargo check --locked --manifest-path frontend/src-tauri/Cargo.toml
