name: BRAND-2B v28 validate candidate

on:
  push:
    branches:
      - owner/issue530-brand2b-landing-r3-v28

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify v28 authority and clean ephemeral gate artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "owner/issue530-brand2b-landing-r3-v28"
          git fetch origin main owner/issue530-brand2b-validation-r3-v16
          test "$(git rev-parse origin/main)" = "0da78df5d2c5337ffeab17e3a00651df507637f0"
          git cat-file -e 4847d6fd441c0c359eb25ea5b8acc9389a057d96^{commit}
          git merge-base --is-ancestor 8f09d49401a278f8e500ff5f75d994e9103bea1f HEAD
          git merge-base --is-ancestor adbf45f81c02a05e55958e38e29931000c27f8bd HEAD
          git diff --exit-code 8f09d49401a278f8e500ff5f75d994e9103bea1f HEAD -- project_state/decision_packet.md
          git diff --exit-code adbf45f81c02a05e55958e38e29931000c27f8bd HEAD -- project_state/gates/command_plan.json
          python -m reverse_agent.project_gate transition-lint --state-dir project_state
          python -m reverse_agent.project_gate transition-preflight --state-dir project_state --mode pre
          python - <<'PY'
          from pathlib import Path
          import subprocess

          allowed = {
              "project_state/gates/bootstrap_state.json",
              "project_state/gates/startup_snapshot.json",
              "project_state/gates/transition_command_plan_preview.json",
              "project_state/gates/transition_preflight_result.json",
          }

          def status_text():
              return subprocess.check_output(
                  ["git", "status", "--porcelain=v1", "--untracked-files=all", "--", "project_state/gates"],
                  text=True,
              )

          status = status_text()
          print("dirty project_state/gates paths after transition-preflight:")
          print(status, end="")
          dirty = set()
          for line in status.splitlines():
              assert len(line) >= 4, line
              path = line[3:]
              assert " -> " not in path, line
              dirty.add(path)
          unexpected = dirty - allowed
          assert not unexpected, f"unexpected dirty gate paths: {sorted(unexpected)}"
          for path in sorted(dirty):
              tracked = subprocess.run(
                  ["git", "ls-files", "--error-unmatch", "--", path],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if tracked:
                  subprocess.check_call(["git", "restore", "--source=HEAD", "--staged", "--worktree", "--", path])
              else:
                  Path(path).unlink(missing_ok=True)
          remaining = status_text()
          print("dirty project_state/gates paths after allowlisted cleanup:")
          print(remaining, end="")
          assert not remaining.strip(), remaining
          PY
          git diff --exit-code 8f09d49401a278f8e500ff5f75d994e9103bea1f HEAD -- project_state/decision_packet.md
          git diff --exit-code adbf45f81c02a05e55958e38e29931000c27f8bd HEAD -- project_state/gates/command_plan.json

      - name: Replay accepted v16 product payload in runner worktree
        shell: bash
        run: |
          set -euo pipefail
          SRC=4847d6fd441c0c359eb25ea5b8acc9389a057d96
          paths=(
            project_state/schemas/mainline_merge_intent_v4.schema.json
            project_state/schemas/merge_approval_attestation_v4.schema.json
            reverse_agent/mainline_landing.py
            reverse_agent/platform_v1/goal_service.py
            reverse_agent/platform_v1/inbox_service.py
            frontend/src/components/goal-composer.tsx
            frontend/src/lib/profile-mapper.ts
            README.txt
            reverse_agent/platform_v1/run_store.py
            reverse_agent/platform_v1/control_store.py
            reverse_agent/platform_v1/task_service.py
            frontend/src/lib/platform-client.ts
            AGENTS.md
            docs/supervisor/audit-instructions.md
            scripts/supervisor_validate.py
            scripts/supervisor_publish.py
            tests/test_project_gate.py
            tests/test_mainline_landing.py
            frontend/tests/compact-goal-composer.test.tsx
            tests/platform_v1/test_publication_controller.py
            tests/platform_v1/test_unattended_coordinator.py
            tests/platform_v1/test_run_read_model.py
            tests/platform_v1/test_goal_service.py
            tests/platform_v1/test_task_service.py
          )
          test "${#paths[@]}" -eq 24
          git restore --source="$SRC" --worktree --staged -- "${paths[@]}"

      - name: Apply exact schema-v4 simulation repair in runner worktree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          src = "4847d6fd441c0c359eb25ea5b8acc9389a057d96"
          rel = "tests/test_mainline_landing.py"
          source = subprocess.check_output(["git", "show", f"{src}:{rel}"])
          start = source.index(b"def test_production_pre_merge_simulation")
          end = source.index(b"\ndef test_state_gate_permissions_are_read_only_and_complete", start)
          block = source[start:end].decode("utf-8")
          needle = '"repository": "dddd2024/reverse-agent"'
          replacement = '"repository": intent[\'repository\']'
          assert block.count(needle) == 2, block.count(needle)
          repaired = block.replace(needle, replacement).encode("utf-8")
          expected = source[:start] + repaired + source[end:]
          Path(rel).write_bytes(expected)
          subprocess.check_call(["git", "add", rel])
          numstat = subprocess.check_output(["git", "diff", "--numstat", src, "--", rel], text=True).strip()
          assert numstat == "2\t2\ttests/test_mainline_landing.py", numstat
          print("authorized replacements: 2")
          print("v16 numstat:", numstat)
          PY

      - name: Prove replay fidelity and PR537 preservation
        shell: bash
        run: |
          set -euo pipefail
          SRC=4847d6fd441c0c359eb25ea5b8acc9389a057d96
          other_paths=(
            project_state/schemas/mainline_merge_intent_v4.schema.json
            project_state/schemas/merge_approval_attestation_v4.schema.json
            reverse_agent/mainline_landing.py
            reverse_agent/platform_v1/goal_service.py
            reverse_agent/platform_v1/inbox_service.py
            frontend/src/components/goal-composer.tsx
            frontend/src/lib/profile-mapper.ts
            README.txt
            reverse_agent/platform_v1/run_store.py
            reverse_agent/platform_v1/control_store.py
            reverse_agent/platform_v1/task_service.py
            frontend/src/lib/platform-client.ts
            AGENTS.md
            docs/supervisor/audit-instructions.md
            scripts/supervisor_validate.py
            scripts/supervisor_publish.py
            tests/test_project_gate.py
            frontend/tests/compact-goal-composer.test.tsx
            tests/platform_v1/test_publication_controller.py
            tests/platform_v1/test_unattended_coordinator.py
            tests/platform_v1/test_run_read_model.py
            tests/platform_v1/test_goal_service.py
            tests/platform_v1/test_task_service.py
          )
          test "${#other_paths[@]}" -eq 23
          for p in "${other_paths[@]}"; do
            git diff --exit-code "$SRC" -- "$p"
          done
          git diff --exit-code origin/main -- tests/platform_v1/test_contracts.py tests/platform_v1/test_merge_intent.py
          git diff --exit-code 8f09d49401a278f8e500ff5f75d994e9103bea1f HEAD -- project_state/decision_packet.md
          git diff --exit-code adbf45f81c02a05e55958e38e29931000c27f8bd HEAD -- project_state/gates/command_plan.json
          test -z "$(git diff --name-only origin/main -- frontend/e2e/snapshots frontend/tests/e2e)"

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run landing blocking tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_project_gate.py -q
          python -m pytest tests/test_integration_baseline.py tests/test_mainline_landing.py tests/test_project_audits.py -q

      - name: Run Platform V1 blocking gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/platform_v1 -q \
            --deselect=tests/platform_v1/test_task3c_v6_production_relay.py::TestCombinedTrustedHostInstalledOpenCodeE2E::test_real_task_api_opencode_relay_fake_provider_end_to_end \
            --deselect=tests/platform_v1/test_task3c_v4_repairs.py::TestInstalledOpenCodeFakeProviderSmoke::test_installed_opencode_fake_provider_end_to_end \
            --deselect=tests/platform_v1/test_task3c_v5_opencode_probe.py::TestDirectFakeProviderControl::test_opencode_direct_fake_provider \
            --deselect=tests/platform_v1/test_task3c_v5_opencode_probe.py::TestRelayFakeProviderRun::test_opencode_relay_fake_provider

      - name: Prove validation helper did not create a commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "validation-only helper completed without commit or push"
