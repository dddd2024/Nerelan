name: BRAND-2B v10 one-time branch patch

on:
  push:
    branches:
      - owner/issue530-brand2b-validation-r3-v10

permissions:
  contents: write

jobs:
  apply-brand2b-v10:
    if: github.repository == 'dddd2024/Nerelan' && github.ref == 'refs/heads/owner/issue530-brand2b-validation-r3-v10'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact v10 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: owner/issue530-brand2b-validation-r3-v10

      - name: Verify immutable v10 authority and locked ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "owner/issue530-brand2b-validation-r3-v10"
          git merge-base --is-ancestor 0feeb3f35ef164591678caba96fb46477b366f52 HEAD
          grep -Fq 'decision_20260901_issue530_brand2b_validation_r3_v10' project_state/decision_packet.md
          test "$(git rev-list --count 0feeb3f35ef164591678caba96fb46477b366f52..HEAD)" -eq 3

      - name: Replay reviewed v8 product blobs only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/owner/issue530-brand2b-validation-r3-v8:refs/remotes/origin/brand2b-v8-source
          test "$(git rev-parse refs/remotes/origin/brand2b-v8-source)" = "2ac33e1d67ec0055bf2a650ebe147e6dec4beb71"
          git checkout 2ac33e1d67ec0055bf2a650ebe147e6dec4beb71 -- \
            project_state/schemas/mainline_merge_intent_v4.schema.json \
            project_state/schemas/merge_approval_attestation_v4.schema.json \
            reverse_agent/mainline_landing.py \
            reverse_agent/platform_v1/goal_service.py \
            reverse_agent/platform_v1/inbox_service.py \
            frontend/src/components/goal-composer.tsx \
            frontend/src/lib/profile-mapper.ts \
            README.txt \
            reverse_agent/platform_v1/run_store.py \
            reverse_agent/platform_v1/control_store.py \
            reverse_agent/platform_v1/task_service.py \
            frontend/src/lib/platform-client.ts \
            AGENTS.md \
            docs/supervisor/audit-instructions.md \
            scripts/supervisor_validate.py \
            scripts/supervisor_publish.py \
            tests/test_project_gate.py \
            frontend/tests/compact-goal-composer.test.tsx \
            tests/platform_v1/test_publication_controller.py \
            tests/platform_v1/test_unattended_coordinator.py \
            tests/platform_v1/test_run_read_model.py

      - name: Derive isolated schema-v4 landing test helpers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast
          import re

          p = Path("tests/test_project_gate.py")
          text = p.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)
          tree = ast.parse(text)

          def function_source(name: str) -> str:
              matches = [n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name]
              if len(matches) != 1:
                  raise SystemExit(f"helper_definition_count:{name}:{len(matches)}")
              n = matches[0]
              return "".join(lines[n.lineno - 1:n.end_lineno])

          def derive(src: str, old_name: str, new_name: str) -> str:
              out = src.replace(f"def {old_name}(", f"def {new_name}(", 1)
              identifiers = sorted(set(re.findall(r"\b[A-Za-z_]\w*(?:v3|schema3)\w*\b", out)), key=len, reverse=True)
              for ident in identifiers:
                  if ident == old_name:
                      continue
                  candidate = ident.replace("schema3", "schema4").replace("v3", "v4")
                  if candidate == ident:
                      continue
                  if candidate not in text:
                      raise SystemExit(f"missing_v4_identifier_counterpart:{ident}->{candidate}")
                  out = out.replace(ident, candidate)
              replacements = [
                  ("mainline_merge_intent_v3.schema.json", "mainline_merge_intent_v4.schema.json"),
                  ("merge_approval_attestation_v3.schema.json", "merge_approval_attestation_v4.schema.json"),
                  ('"schema_version": 3', '"schema_version": 4'),
                  ("'schema_version': 3", "'schema_version': 4"),
                  ('"dddd2024/reverse-agent"', '"dddd2024/Nerelan"'),
                  ("'dddd2024/reverse-agent'", "'dddd2024/Nerelan'"),
              ]
              for old, new in replacements:
                  out = out.replace(old, new)
              # No v3/schema3 identifier may survive in the new helper except prose/comments.
              code_only = "\n".join(line for line in out.splitlines() if not line.lstrip().startswith("#"))
              leftovers = sorted(set(re.findall(r"\b[A-Za-z_]\w*(?:v3|schema3)\w*\b", code_only)))
              leftovers = [x for x in leftovers if x not in {new_name}]
              if leftovers:
                  raise SystemExit(f"v3_identifier_leftovers:{new_name}:{leftovers}")
              return out

          old_fixture = "_v3_landing_fixture"
          old_preflight = "_run_v3_landing_preflight"
          new_fixture = "_v4_landing_fixture"
          new_preflight = "_run_v4_landing_preflight"
          if f"def {new_fixture}(" in text or f"def {new_preflight}(" in text:
              raise SystemExit("v4_helpers_already_exist_unexpectedly")

          fixture_src = function_source(old_fixture)
          preflight_src = function_source(old_preflight)
          print("v3_fixture_source:\n", fixture_src)
          print("v3_preflight_source:\n", preflight_src)
          v4_fixture = derive(fixture_src, old_fixture, new_fixture)
          v4_preflight = derive(preflight_src, old_preflight, new_preflight)
          print("derived_v4_fixture:\n", v4_fixture)
          print("derived_v4_preflight:\n", v4_preflight)

          target = "test_v4_exact_schema4_intent_event_remote_pr_and_attestation_pass"
          marker = f"def {target}"
          start = text.find(marker)
          if start < 0:
              raise SystemExit("target_test_missing")
          next_def = text.find("\ndef test_", start + len(marker))
          end = len(text) if next_def < 0 else next_def + 1
          block = text[start:end]
          if block.count("_v3_landing_fixture(tmp_path)") != 1 or block.count("_run_v3_landing_preflight(fx, tmp_path, monkeypatch)") != 1:
              raise SystemExit("target_v3_binding_shape_changed")
          block = block.replace("_v3_landing_fixture(tmp_path)", "_v4_landing_fixture(tmp_path)", 1)
          block = block.replace("_run_v3_landing_preflight(fx, tmp_path, monkeypatch)", "_run_v4_landing_preflight(fx, tmp_path, monkeypatch)", 1)

          insertion = v4_fixture.rstrip() + "\n\n\n" + v4_preflight.rstrip() + "\n\n\n"
          text = text[:start] + insertion + block + text[end:]
          p.write_text(text, encoding="utf-8")
          ast.parse(text)
          print("isolated v4 helpers inserted and current v4 test rebound")
          PY

      - name: Install package for exact target validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Require exact target pytest before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_project_gate.py::test_v4_exact_schema4_intent_event_remote_pr_and_attestation_pass

      - name: Prove final path scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue530-brand2b-v10-patch.yml
          test ! -e .github/workflows/issue530-brand2b-v10-patch.yml
          python - <<'PY'
          import subprocess
          allowed = {
              "project_state/decision_packet.md", "project_state/gates/command_plan.json",
              "project_state/schemas/mainline_merge_intent_v4.schema.json", "project_state/schemas/merge_approval_attestation_v4.schema.json",
              "reverse_agent/mainline_landing.py", "reverse_agent/platform_v1/goal_service.py", "reverse_agent/platform_v1/inbox_service.py",
              "frontend/src/components/goal-composer.tsx", "frontend/src/lib/profile-mapper.ts", "README.txt",
              "reverse_agent/platform_v1/run_store.py", "reverse_agent/platform_v1/control_store.py", "reverse_agent/platform_v1/task_service.py",
              "frontend/src/lib/platform-client.ts", "AGENTS.md", "docs/supervisor/audit-instructions.md",
              "scripts/supervisor_validate.py", "scripts/supervisor_publish.py", "tests/test_project_gate.py",
              "frontend/tests/compact-goal-composer.test.tsx", "tests/platform_v1/test_publication_controller.py",
              "tests/platform_v1/test_unattended_coordinator.py", "tests/platform_v1/test_run_read_model.py",
          }
          out = subprocess.check_output(["git", "diff", "--name-only", "0feeb3f35ef164591678caba96fb46477b366f52"], text=True)
          changed = {x.strip() for x in out.splitlines() if x.strip()}
          outside = sorted(changed - allowed)
          required = allowed - {"project_state/decision_packet.md", "project_state/gates/command_plan.json"}
          missing = sorted(required - changed)
          print("changed=", sorted(changed)); print("outside=", outside); print("missing=", missing)
          if outside or missing:
              raise SystemExit(1)
          PY

      - name: Commit and push one implementation commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "BRAND-2B: add schema-v4 landing test helpers"
          test "$(git rev-list --count 0feeb3f35ef164591678caba96fb46477b366f52..HEAD)" -eq 4
          git push origin HEAD:owner/issue530-brand2b-validation-r3-v10
