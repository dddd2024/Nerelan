name: Model Access

on:
  pull_request:
    paths:
      - ".github/workflows/model-access.yml"
      - "frontend/**"
      - "reverse_agent/model_access/**"
      - "tests/test_model_access.py"
      - "docs/model-access.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/model-access.yml"
      - "frontend/**"
      - "reverse_agent/model_access/**"
      - "tests/test_model_access.py"
      - "docs/model-access.md"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python package
        run: python -m pip install -e ".[test]"

      - name: Model access Python tests
        run: python -m pytest tests/test_model_access.py -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Production dependency audit
        run: npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Frontend tests
        run: npm --prefix frontend test

      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

      - name: Frontend lint
        run: npm --prefix frontend run lint

      - name: Frontend production build
        run: npm --prefix frontend run build

      - name: Frontend mock build
        run: npm --prefix frontend run build:mock
