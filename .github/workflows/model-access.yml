name: Model Access

on:
  pull_request:
    paths:
      - ".github/workflows/model-access.yml"
      - "frontend/**"
      - "reverse_agent/model_access/**"
      - "tests/test_model_access.py"
      - "docs/model-access.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/model-access.yml"
      - "frontend/**"
      - "reverse_agent/model_access/**"
      - "tests/test_model_access.py"
      - "docs/model-access.md"

permissions:
  contents: write

jobs:
  verify:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'owner/model-access-frontend-closeout-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Owner branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python package
        run: python -m pip install -e ".[test]"

      - name: Model access Python tests
        run: python -m pytest tests/test_model_access.py -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate frontend lockfile
        run: npm install --prefix frontend --package-lock-only --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Production dependency audit
        run: npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Frontend tests
        run: npm --prefix frontend test

      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

      - name: Frontend lint
        run: npm --prefix frontend run lint

      - name: Frontend production build
        run: npm --prefix frontend run build

      - name: Frontend mock build
        run: npm --prefix frontend run build:mock

      - name: Commit generated lockfile on Owner branch
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "security(frontend): refresh lockfile for React Router 8.3.0"
          git push origin HEAD:owner/model-access-frontend-closeout-v1
