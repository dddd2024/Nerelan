name: BRAND-2B v16 one-time Platform V1 fixture patch

on:
  push:
    branches:
      - owner/issue530-brand2b-validation-r3-v16

permissions:
  contents: write

jobs:
  apply-brand2b-v16:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact v16 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: owner/issue530-brand2b-validation-r3-v16

      - name: Configure required Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify immutable v16 authority and locked ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "owner/issue530-brand2b-validation-r3-v16"
          git merge-base --is-ancestor 0feeb3f35ef164591678caba96fb46477b366f52 HEAD
          grep -Fq 'decision_20260901_issue530_brand2b_validation_r3_v16' project_state/decision_packet.md
          test "$(git rev-list --count 0feeb3f35ef164591678caba96fb46477b366f52..HEAD)" -eq 3
          python - <<'PY'
          import sys
          if sys.version_info < (3, 13):
              raise SystemExit(f"v16_python_floor_not_met:{sys.version}")
          PY

      - name: Replay exact reviewed v15 candidate payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/owner/issue530-brand2b-validation-r3-v15:refs/remotes/origin/brand2b-v15-source
          test "$(git rev-parse refs/remotes/origin/brand2b-v15-source)" = "391d78b34813d877ad9bbe236ef8d73c6568a1e0"
          git checkout 391d78b34813d877ad9bbe236ef8d73c6568a1e0 -- \
            project_state/schemas/mainline_merge_intent_v4.schema.json \
            project_state/schemas/merge_approval_attestation_v4.schema.json \
            reverse_agent/mainline_landing.py \
            reverse_agent/platform_v1/goal_service.py \
            reverse_agent/platform_v1/inbox_service.py \
            frontend/src/components/goal-composer.tsx \
            frontend/src/lib/profile-mapper.ts \
            README.txt \
            reverse_agent/platform_v1/run_store.py \
            reverse_agent/platform_v1/control_store.py \
            reverse_agent/platform_v1/task_service.py \
            frontend/src/lib/platform-client.ts \
            AGENTS.md \
            docs/supervisor/audit-instructions.md \
            scripts/supervisor_validate.py \
            scripts/supervisor_publish.py \
            tests/test_project_gate.py \
            tests/test_mainline_landing.py \
            frontend/tests/compact-goal-composer.test.tsx \
            tests/platform_v1/test_publication_controller.py \
            tests/platform_v1/test_unattended_coordinator.py \
            tests/platform_v1/test_run_read_model.py

      - name: Align only current-default Platform V1 repository fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast

          def function_block(text: str, name: str) -> tuple[int, int, str]:
              tree = ast.parse(text)
              nodes = [n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name]
              if len(nodes) != 1:
                  raise SystemExit(f"v16_function_count:{name}:{len(nodes)}")
              lines = text.splitlines(keepends=True)
              node = nodes[0]
              start = sum(len(x) for x in lines[:node.lineno - 1])
              end = sum(len(x) for x in lines[:node.end_lineno])
              return start, end, text[start:end]

          def replace_function(path: Path, name: str, mutate):
              original = path.read_text(encoding="utf-8")
              start, end, source = function_block(original, name)
              replacement = mutate(source)
              if replacement == source:
                  raise SystemExit(f"v16_no_change:{path}:{name}")
              final = original[:start] + replacement + original[end:]
              ast.parse(final)
              path.write_text(final, encoding="utf-8")

          goal_path = Path("tests/platform_v1/test_goal_service.py")

          def patch_window(source: str) -> str:
              old_sig = 'def _window_payload():'
              new_sig = 'def _window_payload(repository: str = "dddd2024/reverse-agent"):'
              old_repo = '"repositories": ["dddd2024/reverse-agent"],'
              if source.count(old_sig) != 1 or source.count(old_repo) != 1:
                  raise SystemExit("v16_goal_window_shape")
              source = source.replace(old_sig, new_sig, 1)
              source = source.replace(old_repo, '"repositories": [repository],', 1)
              return source

          replace_function(goal_path, "_window_payload", patch_window)

          def patch_goal_snapshot(source: str) -> str:
              old = 'window = autonomy.activate(_window_payload())'
              new = 'window = autonomy.activate(_window_payload(repository=goal.repository))'
              if source.count(old) != 1:
                  raise SystemExit(f"v16_goal_snapshot_call_count:{source.count(old)}")
              return source.replace(old, new, 1)

          replace_function(goal_path, "test_goal_response_status_uses_the_returned_link_snapshot", patch_goal_snapshot)

          goal_text = goal_path.read_text(encoding="utf-8")
          _, _, legacy_test = function_block(goal_text, "test_goal_plan_approval_and_launch_are_persistent_and_idempotent")
          if '"repository": "dddd2024/reverse-agent"' not in legacy_test:
              raise SystemExit("v16_legacy_goal_compatibility_lost")
          if 'autonomy.activate(_window_payload())' not in legacy_test:
              raise SystemExit("v16_legacy_goal_window_behavior_changed")

          task_path = Path("tests/platform_v1/test_task_service.py")

          def patch_task_http(source: str) -> str:
              old = '"repositories": ["dddd2024/reverse-agent"], "capabilities": ["execute_task"],'
              new = '"repositories": [goal["repository"]], "capabilities": ["execute_task"],'
              if source.count(old) != 1:
                  raise SystemExit(f"v16_task_http_repo_count:{source.count(old)}")
              return source.replace(old, new, 1)

          replace_function(task_path, "test_agent_runs_listing_and_detail_over_http", patch_task_http)
          print("v16_platform_fixture_patch_applied")
          PY

      - name: Install project test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"

      - name: Require exact CI Platform V1 blocking gate to pass before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/platform_v1 -q \
            --deselect=tests/platform_v1/test_task3c_v6_production_relay.py::TestCombinedTrustedHostInstalledOpenCodeE2E::test_real_task_api_opencode_relay_fake_provider_end_to_end \
            --deselect=tests/platform_v1/test_task3c_v4_repairs.py::TestInstalledOpenCodeFakeProviderSmoke::test_installed_opencode_fake_provider_end_to_end \
            --deselect=tests/platform_v1/test_task3c_v5_opencode_probe.py::TestDirectFakeProviderControl::test_opencode_direct_fake_provider \
            --deselect=tests/platform_v1/test_task3c_v5_opencode_probe.py::TestRelayFakeProviderRun::test_opencode_relay_fake_provider

      - name: Prove v15 replay fidelity and final path scope
        shell: bash
        run: |
          set -euo pipefail
          replay_paths=(
            project_state/schemas/mainline_merge_intent_v4.schema.json
            project_state/schemas/merge_approval_attestation_v4.schema.json
            reverse_agent/mainline_landing.py
            reverse_agent/platform_v1/goal_service.py
            reverse_agent/platform_v1/inbox_service.py
            frontend/src/components/goal-composer.tsx
            frontend/src/lib/profile-mapper.ts
            README.txt
            reverse_agent/platform_v1/run_store.py
            reverse_agent/platform_v1/control_store.py
            reverse_agent/platform_v1/task_service.py
            frontend/src/lib/platform-client.ts
            AGENTS.md
            docs/supervisor/audit-instructions.md
            scripts/supervisor_validate.py
            scripts/supervisor_publish.py
            tests/test_project_gate.py
            tests/test_mainline_landing.py
            frontend/tests/compact-goal-composer.test.tsx
            tests/platform_v1/test_publication_controller.py
            tests/platform_v1/test_unattended_coordinator.py
            tests/platform_v1/test_run_read_model.py
          )
          for p in "${replay_paths[@]}"; do
            git diff --quiet 391d78b34813d877ad9bbe236ef8d73c6568a1e0 -- "$p" || { echo "v16_v15_replay_drift:$p"; exit 1; }
          done
          git diff --quiet 391d78b34813d877ad9bbe236ef8d73c6568a1e0 -- tests/platform_v1/test_goal_service.py && { echo "v16_expected_goal_fixture_delta_missing"; exit 1; }
          git diff --quiet 391d78b34813d877ad9bbe236ef8d73c6568a1e0 -- tests/platform_v1/test_task_service.py && { echo "v16_expected_task_fixture_delta_missing"; exit 1; }
          rm .github/workflows/issue530-brand2b-v16-patch.yml
          test ! -e .github/workflows/issue530-brand2b-v16-patch.yml
          python - <<'PY'
          import subprocess
          allowed = {
              "project_state/decision_packet.md", "project_state/gates/command_plan.json",
              "project_state/schemas/mainline_merge_intent_v4.schema.json", "project_state/schemas/merge_approval_attestation_v4.schema.json",
              "reverse_agent/mainline_landing.py", "reverse_agent/platform_v1/goal_service.py", "reverse_agent/platform_v1/inbox_service.py",
              "frontend/src/components/goal-composer.tsx", "frontend/src/lib/profile-mapper.ts", "README.txt",
              "reverse_agent/platform_v1/run_store.py", "reverse_agent/platform_v1/control_store.py", "reverse_agent/platform_v1/task_service.py",
              "frontend/src/lib/platform-client.ts", "AGENTS.md", "docs/supervisor/audit-instructions.md",
              "scripts/supervisor_validate.py", "scripts/supervisor_publish.py", "tests/test_project_gate.py", "tests/test_mainline_landing.py",
              "frontend/tests/compact-goal-composer.test.tsx", "tests/platform_v1/test_publication_controller.py",
              "tests/platform_v1/test_unattended_coordinator.py", "tests/platform_v1/test_run_read_model.py",
              "tests/platform_v1/test_goal_service.py", "tests/platform_v1/test_task_service.py",
          }
          out = subprocess.check_output(["git", "diff", "--name-only", "0feeb3f35ef164591678caba96fb46477b366f52"], text=True)
          changed = {x.strip() for x in out.splitlines() if x.strip()}
          outside = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          print("changed=", sorted(changed)); print("outside=", outside); print("missing=", missing)
          if outside or missing:
              raise SystemExit(1)
          PY

      - name: Commit and push one implementation commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "BRAND-2B: align Platform V1 repository fixtures with Nerelan"
          test "$(git rev-list --count 0feeb3f35ef164591678caba96fb46477b366f52..HEAD)" -eq 4
          git push origin HEAD:owner/issue530-brand2b-validation-r3-v16
