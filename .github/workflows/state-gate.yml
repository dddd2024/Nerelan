name: State Gate

# Governance v2 (lean controlled landing). See AGENTS.md and
# docs/agents/governance-reference.md.
#
#   state-gate          every PR event: exact-range hygiene + governance unit tests
#   landing-state-gate  Ready PRs: an independent review verdict bound to the
#                       exact head commit ("Nerelan-Review: ACCEPT <sha>")
#
# Both job names are required status checks in the repository ruleset, together
# with CI's `baseline`. The ruleset also enforces merge-commit only, an
# up-to-date branch, resolved review threads and no force push / deletion.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - converted_to_draft
      - ready_for_review

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  state-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Exact-range hygiene
        if: github.event_name == 'pull_request'
        run: >-
          python -m reverse_agent.landing_review hygiene
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Governance unit tests
        run: python -m pytest tests/test_landing_review.py tests/test_agent_instruction_context.py tests/test_state_gate_exact_head_checkout.py -q

  landing-state-gate:
    needs: state-gate
    # A conditionally skipped required job reports Success. Keep this job alive
    # and vary only its display name so a Draft can never pre-satisfy landing.
    name: >-
      ${{ github.event_name == 'pull_request' &&
          (github.event.action == 'converted_to_draft' || github.event.pull_request.draft == false) &&
          'landing-state-gate' || 'landing-state-gate-draft-inert' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve engineering Draft context
        if: github.event.pull_request.draft && github.event.action != 'converted_to_draft'
        run: echo "Engineering Draft; landing context intentionally absent."

      - name: Invalidate converted-to-Draft landing context
        if: github.event.action == 'converted_to_draft'
        run: |
          echo "Landing context revoked by conversion to Draft." >&2
          exit 1

      # The verdict checker runs from the trusted base commit, so a candidate
      # cannot weaken the check that admits it.
      - name: Checkout trusted base
        if: github.event.pull_request.draft == false
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap checker from candidate when base predates it
        if: github.event.pull_request.draft == false && hashFiles('reverse_agent/landing_review.py') == ''
        run: |
          echo "::warning::Base has no landing_review.py; using the candidate's checker once (Governance v2 bootstrap)."
          git checkout --detach "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        if: github.event.pull_request.draft == false
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Require exact-head independent review verdict
        if: github.event.pull_request.draft == false
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m reverse_agent.landing_review review --event-path "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY"
