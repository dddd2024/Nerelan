name: State Gate

on:
  push:
    paths:
      - "project_state/**"
      - "reverse_agent/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".codex-skills/**"
      - "docs/prompts/**"
  pull_request:
    paths:
      - "project_state/**"
      - "reverse_agent/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".codex-skills/**"
      - "docs/prompts/**"
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

jobs:
  state-gate:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Detect control-plane mode
        id: control_plane
        shell: bash
        run: echo "mode=$(python -m reverse_agent.project_gate control-plane-mode --state-dir project_state)" >> "$GITHUB_OUTPUT"

      - name: Transition lint
        if: steps.control_plane.outputs.mode == 'transition'
        run: python -m reverse_agent.project_gate transition-lint --state-dir project_state

      - name: Transition command plan
        if: steps.control_plane.outputs.mode == 'transition'
        run: python -m reverse_agent.project_gate transition-command-plan --state-dir project_state

      - name: Transition preflight
        if: steps.control_plane.outputs.mode == 'transition' && github.ref != 'refs/heads/main'
        run: python -m reverse_agent.project_gate transition-preflight --state-dir project_state

      - name: Historical integration baseline
        if: steps.control_plane.outputs.mode == 'transition' && github.ref == 'refs/heads/main'
        run: python -m reverse_agent.project_gate integration-baseline --state-dir project_state

      - name: Current mainline merge validation
        if: steps.control_plane.outputs.mode == 'transition' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m reverse_agent.project_gate mainline-merge-validation --state-dir project_state

      - name: Emit mainline integration receipt
        if: steps.control_plane.outputs.mode == 'transition' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          python -m reverse_agent.project_gate emit-mainline-integration-receipt
          --state-dir project_state
          --output "${{ runner.temp }}/mainline_integration_receipt.json"

      - name: Project gate preflight
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate preflight --state-dir project_state

      - name: Project gate command plan
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate command-plan --state-dir project_state

      - name: Project gate post-final evidence sync
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate post-final-evidence-sync --state-dir project_state

      - name: Project gate job lifecycle
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate job-lifecycle --state-dir project_state

      - name: Project gate audit inventory
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate audit-inventory --state-dir project_state

      - name: Project gate audit readiness packet
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate audit-readiness-packet --state-dir project_state

      - name: Project gate current handoff packet
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate current-handoff-packet --state-dir project_state

      - name: Project gate local execution bundle
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate local-execution-bundle --state-dir project_state

      - name: Project gate Codex prompt packet
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate codex-prompt-packet --state-dir project_state

      - name: Project gate audit precheck
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate audit-precheck --state-dir project_state

      - name: Project gate report summary
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate report-summary --state-dir project_state

      - name: Project gate execution log
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate execution-log --state-dir project_state

      - name: CI workflow coverage
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate ci-workflow-coverage --state-dir project_state

      - name: CI workflow readiness
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate ci-workflow-readiness --state-dir project_state

      - name: Decision preflight
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate decision-preflight --state-dir project_state

      - name: CI run evidence
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate ci-run-evidence --state-dir project_state

      - name: Local CI parity
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate local-ci-parity --state-dir project_state

      - name: CI observation schema
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate ci-observation-schema --state-dir project_state

      - name: CI observation handoff
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate ci-observation-handoff --state-dir project_state

      - name: CI observation reconcile
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate ci-observation-reconcile --state-dir project_state

      - name: CI artifact manifest
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate ci-artifact-manifest --state-dir project_state

      - name: CI audit handoff bundle
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate ci-audit-handoff-bundle --state-dir project_state

      - name: Focused gate tests
        run: python -m pytest tests/test_project_gate.py tests/test_project_reports.py tests/test_project_jobs.py tests/test_post_final_evidence_sync.py tests/test_decision_preflight.py tests/test_project_state.py -q

      - name: Project gate final check
        if: steps.control_plane.outputs.mode == 'legacy'
        run: python -m reverse_agent.project_gate final-check --state-dir project_state

      - name: Upload project gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-gate-evidence
          if-no-files-found: warn
          path: |
            project_state/gates/*.json
            project_state/pytest_result.txt
            ${{ runner.temp }}/mainline_integration_receipt.json

  bootstrap-authority:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.number == 106 &&
      github.repository == 'dddd2024/reverse-agent' &&
      github.event.pull_request.head.repo.full_name == 'dddd2024/reverse-agent' &&
      github.event.pull_request.head.ref == 'agent/restore-path-a-state-gate-current-main-v1' &&
      github.event.pull_request.base.repo.full_name == 'dddd2024/reverse-agent' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      trusted_base_sha: ${{ steps.authority.outputs.trusted_base_sha }}
      candidate_head_sha: ${{ steps.authority.outputs.candidate_head_sha }}
      changed_paths_sha256: ${{ steps.authority.outputs.changed_paths_sha256 }}
      ci_run_id: ${{ steps.authority.outputs.ci_run_id }}
      preflight_run_id: ${{ steps.authority.outputs.preflight_run_id }}
    steps:
      - name: Checkout exact trusted B3
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify bounded B3 and candidate authority
        id: authority
        shell: bash
        env:
          BOOTSTRAP_API_TOKEN: ${{ github.token }}
          TRUSTED_RUN_SHA: ${{ github.sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          EVENT_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          readonly REPOSITORY='dddd2024/reverse-agent'
          readonly PR_NUMBER='106'
          readonly BOOTSTRAP_PR_NUMBER='112'
          readonly EXPECTED_BRANCH='agent/restore-path-a-state-gate-current-main-v1'
          readonly BOOTSTRAP_BRANCH='owner/state-gate-bootstrap-v13-retry-v3'
          readonly H0='ff7dd9091a48c5c2fad315812e672d5089824d09'
          readonly B2='93984db182b7ee11b3ccb8795bb5fc3741205b92'
          readonly B3="$EVENT_BASE_SHA"
          readonly CANDIDATE_HEAD="$EVENT_HEAD_SHA"

          test "$GITHUB_EVENT_NAME" = 'pull_request_target'
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$EVENT_PR_NUMBER" = "$PR_NUMBER"
          test "$EVENT_HEAD_REPOSITORY" = "$REPOSITORY"
          test "$EVENT_HEAD_BRANCH" = "$EXPECTED_BRANCH"
          test "$EVENT_BASE_REPOSITORY" = "$REPOSITORY"
          test "$EVENT_BASE_BRANCH" = 'main'
          test "$TRUSTED_RUN_SHA" = "$B3"
          test "$(git rev-parse HEAD)" = "$B3"

          api_get() {
            curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $BOOTSTRAP_API_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/$1"
          }

          api_get "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/bootstrap-pr106.json"
          jq -e \
            --arg repository "$REPOSITORY" \
            --arg branch "$EXPECTED_BRANCH" \
            --arg head "$CANDIDATE_HEAD" \
            --arg base "$B3" \
            '.number == 106
             and .state == "open"
             and .draft == true
             and .head.repo.full_name == $repository
             and .head.ref == $branch
             and .head.sha == $head
             and .base.repo.full_name == $repository
             and .base.ref == "main"
             and .base.sha == $base
             and .auto_merge == null' \
            "$RUNNER_TEMP/bootstrap-pr106.json" > /dev/null

          api_get "repos/$REPOSITORY/pulls/$BOOTSTRAP_PR_NUMBER" > "$RUNNER_TEMP/bootstrap-pr112.json"
          jq -e \
            --arg repository "$REPOSITORY" \
            --arg branch "$BOOTSTRAP_BRANCH" \
            --arg base "$B2" \
            --arg merge_commit "$B3" \
            '.number == 112
             and .state == "closed"
             and .merged == true
             and .draft == false
             and .head.repo.full_name == $repository
             and .head.ref == $branch
             and .base.repo.full_name == $repository
             and .base.ref == "main"
             and .base.sha == $base
             and .merge_commit_sha == $merge_commit
             and .auto_merge == null' \
            "$RUNNER_TEMP/bootstrap-pr112.json" > /dev/null
          readonly PR112_HEAD="$(jq -r '.head.sha' "$RUNNER_TEMP/bootstrap-pr112.json")"

          git config --local --unset-all http.https://github.com/.extraheader || true
          git fetch --no-tags origin "$B2" "$H0" "$B3" "$CANDIDATE_HEAD" "$PR112_HEAD"
          for revision in "$B2" "$H0" "$B3" "$CANDIDATE_HEAD" "$PR112_HEAD"; do
            test "$(git cat-file -t "$revision")" = 'commit'
          done

          git merge-base --is-ancestor "$B2" "$B3"
          read -r -a b3_parents <<< "$(git rev-list --parents -n 1 "$B3")"
          test "${#b3_parents[@]}" -eq 3
          test "${b3_parents[1]}" = "$B2"
          test "${b3_parents[2]}" = "$PR112_HEAD"

          git merge-base --is-ancestor "$H0" "$CANDIDATE_HEAD"
          git merge-base --is-ancestor "$B3" "$CANDIDATE_HEAD"
          mapfile -t candidate_chain < <(git rev-list --first-parent --reverse "$H0..$CANDIDATE_HEAD")
          test "${#candidate_chain[@]}" -eq 4
          read -r -a merge_parents <<< "$(git rev-list --parents -n 1 "${candidate_chain[0]}")"
          test "${#merge_parents[@]}" -eq 3
          test "${merge_parents[1]}" = "$H0"
          test "${merge_parents[2]}" = "$B3"
          for index in 1 2 3; do
            read -r -a linear_parents <<< "$(git rev-list --parents -n 1 "${candidate_chain[$index]}")"
            test "${#linear_parents[@]}" -eq 2
            test "${linear_parents[1]}" = "${candidate_chain[$((index - 1))]}"
          done

          export B2 H0 B3 CANDIDATE_HEAD
          python - <<'PY'
          import ast
          import copy
          import hashlib
          import json
          import os
          import re
          import subprocess

          b2 = os.environ["B2"]
          h0 = os.environ["H0"]
          b3 = os.environ["B3"]
          candidate_head = os.environ["CANDIDATE_HEAD"]
          pr112_paths = {
              ".github/workflows/state-gate.yml",
              "project_state/decision_packet.md",
              "project_state/gates/bootstrap_state.json",
              "project_state/gates/command_plan.json",
              "project_state/gates/startup_snapshot.json",
              "project_state/gates/transition_command_plan_preview.json",
              "project_state/gates/transition_preflight_result.json",
              "project_state/mainline_merge_intents/active.json",
              "project_state/mainline_merge_intents/archive/pr110_v1.json",
              "tests/platform_v1/test_contracts.py",
              "tests/platform_v1/test_merge_intent.py",
          }
          pr106_paths = {
              "project_state/decision_packet.md",
              "project_state/gates/bootstrap_state.json",
              "project_state/gates/command_plan.json",
              "project_state/gates/startup_snapshot.json",
              "project_state/gates/transition_command_plan_preview.json",
              "project_state/gates/transition_preflight_result.json",
              "project_state/mainline_merge_intents/active.json",
              "project_state/mainline_merge_intents/archive/pr106_v11r2.json",
              "tests/platform_v1/test_authority_adapter.py",
              "tests/platform_v1/test_contracts.py",
              "tests/platform_v1/test_merge_intent.py",
          }
          generated_paths = {
              "project_state/gates/bootstrap_state.json",
              "project_state/gates/command_plan.json",
              "project_state/gates/startup_snapshot.json",
              "project_state/gates/transition_command_plan_preview.json",
              "project_state/gates/transition_preflight_result.json",
          }

          def normalize(path: str) -> str:
              if not path or "\x00" in path:
                  raise SystemExit("empty or NUL changed path")
              normalized = path.replace("\\", "/")
              while normalized.startswith("./"):
                  normalized = normalized[2:]
              normalized = re.sub(r"/+", "/", normalized)
              if not normalized or normalized == ".":
                  raise SystemExit("empty changed path")
              if normalized.startswith("/") or re.match(r"^[A-Za-z]:", normalized):
                  raise SystemExit("absolute changed path")
              parts = [part for part in normalized.split("/") if part]
              if ".." in parts:
                  raise SystemExit("traversal changed path")
              return "/".join(parts)

          def changed_paths(start: str, end: str) -> list[str]:
              result = subprocess.run(
                  ["git", "diff", "--name-status", "-M", "-C", f"{start}..{end}"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              raw_paths: list[str] = []
              for line in result.stdout.splitlines():
                  if not line:
                      continue
                  fields = line.split("\t")
                  status = fields[0]
                  if status.startswith(("R", "C")):
                      if len(fields) != 3:
                          raise SystemExit("malformed rename/copy record")
                      raw_paths.extend(fields[1:])
                  else:
                      if len(fields) != 2:
                          raise SystemExit("malformed changed-path record")
                      raw_paths.append(fields[1])
              return sorted(dict.fromkeys(normalize(path) for path in raw_paths))

          def commit_paths(commit: str) -> set[str]:
              parent = subprocess.check_output(
                  ["git", "rev-parse", f"{commit}^1"], text=True
              ).strip()
              return set(changed_paths(parent, commit))

          b3_paths = set(changed_paths(b2, b3))
          if b3_paths != pr112_paths:
              raise SystemExit(f"unexpected B2..B3 paths: {sorted(b3_paths)}")
          chain = subprocess.check_output(
              ["git", "rev-list", "--first-parent", "--reverse", f"{h0}..{candidate_head}"],
              text=True,
          ).splitlines()
          merge_tree = subprocess.check_output(
              ["git", "rev-parse", f"{chain[0]}^{{tree}}"], text=True
          ).strip()
          h0_tree = subprocess.check_output(
              ["git", "rev-parse", f"{h0}^{{tree}}"], text=True
          ).strip()
          if merge_tree != h0_tree:
              raise SystemExit("PR106 H0+B3 merge tree differs from H0")
          if commit_paths(chain[1]) != {"project_state/decision_packet.md"}:
              raise SystemExit("PR106 Decision commit path set mismatch")
          if commit_paths(chain[2]) != generated_paths:
              raise SystemExit("PR106 generated-authority commit path set mismatch")
          if commit_paths(chain[3]) != {
              "project_state/mainline_merge_intents/active.json",
              "project_state/mainline_merge_intents/archive/pr106_v11r2.json",
              "tests/platform_v1/test_authority_adapter.py",
              "tests/platform_v1/test_contracts.py",
              "tests/platform_v1/test_merge_intent.py",
          }:
              raise SystemExit("PR106 Intent-bind commit path set mismatch")
          candidate_paths = set(changed_paths(h0, candidate_head))
          if candidate_paths != pr106_paths:
              raise SystemExit(f"unexpected H0..candidate paths: {sorted(candidate_paths)}")

          workflow_path = ".github/workflows/state-gate.yml"
          h0_workflow = subprocess.check_output(
              ["git", "rev-parse", f"{h0}:{workflow_path}"], text=True
          ).strip()
          candidate_workflow = subprocess.check_output(
              ["git", "rev-parse", f"{candidate_head}:{workflow_path}"], text=True
          ).strip()
          if h0_workflow != candidate_workflow:
              raise SystemExit("candidate workflow blob differs from H0")
          h0_production = subprocess.check_output(
              ["git", "rev-parse", f"{h0}:reverse_agent"], text=True
          ).strip()
          candidate_production = subprocess.check_output(
              ["git", "rev-parse", f"{candidate_head}:reverse_agent"], text=True
          ).strip()
          if h0_production != candidate_production:
              raise SystemExit("candidate production Python tree differs from H0")
          archived = subprocess.check_output(
              ["git", "rev-parse", f"{candidate_head}:project_state/mainline_merge_intents/archive/pr106_v11r2.json"],
              text=True,
          ).strip()
          prior_active = subprocess.check_output(
              ["git", "rev-parse", f"{h0}:project_state/mainline_merge_intents/active.json"],
              text=True,
          ).strip()
          if archived != prior_active:
              raise SystemExit("pr106_v11r2 archive differs from H0 active Intent")

          archive_prefix = "project_state/mainline_merge_intents/archive/"
          historical_archives = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", h0, archive_prefix],
              text=True,
          ).splitlines()
          if not historical_archives:
              raise SystemExit("H0 historical archive inventory is empty")
          for archive_path in historical_archives:
              h0_archive = subprocess.check_output(
                  ["git", "rev-parse", f"{h0}:{archive_path}"], text=True
              ).strip()
              candidate_archive = subprocess.check_output(
                  ["git", "rev-parse", f"{candidate_head}:{archive_path}"], text=True
              ).strip()
              if h0_archive != candidate_archive:
                  raise SystemExit(f"historical archive changed: {archive_path}")

          def blob(path: str) -> bytes:
              return subprocess.check_output(["git", "show", f"{candidate_head}:{path}"])

          def json_blob(path: str) -> dict:
              return json.loads(blob(path).decode("utf-8"))

          semantic_test_paths = (
              "tests/platform_v1/test_authority_adapter.py",
              "tests/platform_v1/test_contracts.py",
              "tests/platform_v1/test_merge_intent.py",
          )

          def validate_semantic_test_sources(
              h0_sources: dict[str, str],
              candidate_sources: dict[str, str],
              runtime_base: str,
          ) -> None:
              historical_base = "fa4f240f7dffff78cdb182ce8655c2e2d7cb241f"
              v14_decision = (
                  "decision_20260804_restore_path_a_state_gate_current_main_v14"
              )
              expected_paths = set(semantic_test_paths)
              if set(h0_sources) != expected_paths or set(candidate_sources) != expected_paths:
                  raise ValueError("semantic source path set mismatch")

              def parse_sources(sources: dict[str, str]) -> dict[str, ast.Module]:
                  return {
                      path: ast.parse(source, filename=path)
                      for path, source in sources.items()
                  }

              def dumped(node: ast.AST) -> str:
                  return ast.dump(node, annotate_fields=True, include_attributes=False)

              def identities(tree: ast.Module) -> dict[str, ast.AST]:
                  found: dict[str, ast.AST] = {}

                  def visit_body(body: list[ast.stmt], prefix: str = "") -> None:
                      for node in body:
                          if isinstance(node, ast.ClassDef):
                              identity = f"{prefix}.{node.name}" if prefix else node.name
                              if identity in found:
                                  raise ValueError(f"duplicate qualified identity: {identity}")
                              found[identity] = node
                              visit_body(node.body, identity)
                          elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                              identity = f"{prefix}.{node.name}" if prefix else node.name
                              if identity in found:
                                  raise ValueError(f"duplicate qualified identity: {identity}")
                              found[identity] = node
                              visit_body(node.body, identity)

                  visit_body(tree.body)
                  return found

              def module_assignment(tree: ast.Module, name: str) -> ast.Assign:
                  matches = [
                      node for node in tree.body
                      if isinstance(node, ast.Assign)
                      and len(node.targets) == 1
                      and isinstance(node.targets[0], ast.Name)
                      and node.targets[0].id == name
                  ]
                  if len(matches) != 1:
                      raise ValueError(f"expected one module assignment: {name}")
                  return matches[0]

              def require_string_assignment(
                  tree: ast.Module, name: str, expected: str
              ) -> ast.Assign:
                  assignment = module_assignment(tree, name)
                  if not isinstance(assignment.value, ast.Constant):
                      raise ValueError(f"non-literal assignment: {name}")
                  if assignment.value.value != expected:
                      raise ValueError(f"assignment mismatch: {name}")
                  return assignment

              def expression(source: str) -> ast.expr:
                  return ast.parse(source, mode="eval").body

              h0_trees = parse_sources(h0_sources)
              candidate_trees = parse_sources(candidate_sources)

              authority_path = "tests/platform_v1/test_authority_adapter.py"
              h0_authority = h0_trees[authority_path]
              candidate_authority = candidate_trees[authority_path]
              if set(identities(candidate_authority)) != set(identities(h0_authority)):
                  raise ValueError("authority adapter qualified identities changed")
              h0_base = module_assignment(h0_authority, "BASE")
              candidate_base = require_string_assignment(
                  candidate_authority, "BASE", runtime_base
              )
              candidate_base.value = copy.deepcopy(h0_base.value)
              if dumped(candidate_authority) != dumped(h0_authority):
                  raise ValueError("authority adapter AST differs outside BASE")

              merge_path = "tests/platform_v1/test_merge_intent.py"
              h0_merge = h0_trees[merge_path]
              candidate_merge = candidate_trees[merge_path]
              fixed_merge_class = ast.parse('''
          class TestArchivedPr106V11r2Intent:
              def test_archive_pr106_v11r2_file_exists(self) -> None:
                  assert ARCHIVE_PR106_V11R2_PATH.exists()

              def test_archive_pr106_v11r2_is_exact_h0_active(self) -> None:
                  payload = ARCHIVE_PR106_V11R2_PATH.read_bytes()
                  original = _committed_blob(
                      "project_state/mainline_merge_intents/active.json",
                      ref=PR106_V11R2_ACTIVE_COMMIT,
                  )
                  assert payload == original

              def test_archive_pr106_v11r2_has_exact_git_blob(self) -> None:
                  payload = ARCHIVE_PR106_V11R2_PATH.read_bytes()
                  header = f"blob {len(payload)}\\0".encode("ascii")
                  assert hashlib.sha1(header + payload).hexdigest() == (
                      "27b0a28c0b227df07dbc6829057d04875dc930ac"
                  )

              def test_archive_pr106_v11r2_preserves_identity_and_base(self) -> None:
                  data = _load_json(ARCHIVE_PR106_V11R2_PATH)
                  assert data["source_pr"] == 106
                  assert data["decision_identity"]["decision_id"] == (
                      "decision_20260804_restore_path_a_state_gate_current_main_v11r2"
                  )
                  assert data["locked_base_sha"] == PR106_HISTORICAL_BASE_SHA
          ''').body[0]
              h0_merge_ids = set(identities(h0_merge))
              candidate_merge_ids = set(identities(candidate_merge))
              fixed_merge_ids = set(identities(ast.Module(body=[fixed_merge_class])))
              if candidate_merge_ids != h0_merge_ids | fixed_merge_ids:
                  raise ValueError("merge-intent qualified identities changed")
              fixed_candidates = [
                  node for node in candidate_merge.body
                  if isinstance(node, ast.ClassDef)
                  and node.name == "TestArchivedPr106V11r2Intent"
              ]
              if len(fixed_candidates) != 1 or dumped(fixed_candidates[0]) != dumped(fixed_merge_class):
                  raise ValueError("fixed v11r2 merge-intent tests mismatch")
              candidate_merge.body.remove(fixed_candidates[0])

              active_base = require_string_assignment(
                  candidate_merge, "EXPECTED_ACTIVE_BASE_SHA", runtime_base
              )
              active_base.value = copy.deepcopy(
                  module_assignment(h0_merge, "EXPECTED_ACTIVE_BASE_SHA").value
              )
              historical = require_string_assignment(
                  candidate_merge, "PR106_HISTORICAL_BASE_SHA", historical_base
              )
              archive_path = module_assignment(candidate_merge, "ARCHIVE_PR106_V11R2_PATH")
              if dumped(archive_path.value) != dumped(
                  expression('INTENTS_DIR / "archive" / "pr106_v11r2.json"')
              ):
                  raise ValueError("v11r2 archive path assignment mismatch")
              active_commit = require_string_assignment(
                  candidate_merge,
                  "PR106_V11R2_ACTIVE_COMMIT",
                  "ff7dd9091a48c5c2fad315812e672d5089824d09",
              )
              active_decision = require_string_assignment(
                  candidate_merge, "EXPECTED_ACTIVE_DECISION_ID_PR106", v14_decision
              )
              active_decision.value = copy.deepcopy(
                  module_assignment(h0_merge, "EXPECTED_ACTIVE_DECISION_ID_PR106").value
              )
              for removable in (historical, archive_path, active_commit):
                  candidate_merge.body.remove(removable)

              merge_ids = identities(candidate_merge)
              historical_tests = (
                  "TestArchivedPr106V3Intent.test_archive_pr106_v3_preserves_locked_base_sha",
                  "TestArchivedPr106V4Intent.test_archive_pr106_v4_preserves_locked_base_sha",
              )
              for identity in historical_tests:
                  function = merge_ids.get(identity)
                  if function is None:
                      raise ValueError(f"historical test missing: {identity}")
                  replacements = 0
                  for node in ast.walk(function):
                      if isinstance(node, ast.Name) and node.id == "PR106_HISTORICAL_BASE_SHA":
                          node.id = "EXPECTED_ACTIVE_BASE_SHA"
                          replacements += 1
                  if replacements != 1:
                      raise ValueError(f"historical base use mismatch: {identity}")
              if dumped(candidate_merge) != dumped(h0_merge):
                  raise ValueError("merge-intent module AST differs outside allowlist")

              contracts_path = "tests/platform_v1/test_contracts.py"
              h0_contracts = h0_trees[contracts_path]
              candidate_contracts = candidate_trees[contracts_path]
              h0_contract_ids = identities(h0_contracts)
              candidate_contract_ids = identities(candidate_contracts)
              added_contract_methods_source = '''
          class _FixedArchiveTests:
              def test_archive_pr106_v11r2_is_exact_h0_active(self) -> None:
                  payload = self._archive_v11r2_pr106_path.read_bytes()
                  original = subprocess.check_output(
                      [
                          "git", "cat-file", "blob",
                          "ff7dd9091a48c5c2fad315812e672d5089824d09:project_state/mainline_merge_intents/active.json",
                      ],
                      cwd=self._repo_root,
                  )
                  assert payload == original
                  header = f"blob {len(payload)}\\0".encode("ascii")
                  assert hashlib.sha1(header + payload).hexdigest() == (
                      "27b0a28c0b227df07dbc6829057d04875dc930ac"
                  )

              def test_archive_pr106_v11r2_preserves_identity_and_base(self) -> None:
                  assert self._archive_v11r2_pr106["source_pr"] == 106
                  assert self._archive_v11r2_pr106["decision_identity"]["decision_id"] == (
                      "decision_20260804_restore_path_a_state_gate_current_main_v11r2"
                  )
                  assert self._archive_v11r2_pr106["locked_base_sha"] == (
                      "fa4f240f7dffff78cdb182ce8655c2e2d7cb241f"
                  )
          '''
              fixed_contract_class = ast.parse(added_contract_methods_source).body[0]
              fixed_methods = fixed_contract_class.body
              expected_added = {
                  f"TestActiveMergeIntentV5.{node.name}" for node in fixed_methods
              }
              if set(candidate_contract_ids) != set(h0_contract_ids) | expected_added:
                  raise ValueError("contracts qualified identities changed")
              active_class_matches = [
                  node for node in candidate_contracts.body
                  if isinstance(node, ast.ClassDef)
                  and node.name == "TestActiveMergeIntentV5"
              ]
              if len(active_class_matches) != 1:
                  raise ValueError("active contracts class identity changed")
              active_class = active_class_matches[0]
              for expected_method in fixed_methods:
                  matches = [
                      node for node in active_class.body
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and node.name == expected_method.name
                  ]
                  if len(matches) != 1 or dumped(matches[0]) != dumped(expected_method):
                      raise ValueError(f"fixed contracts test mismatch: {expected_method.name}")
                  active_class.body.remove(matches[0])

              candidate_contract_ids = identities(candidate_contracts)
              fixture = candidate_contract_ids.get("TestActiveMergeIntentV5._load_intents")
              if fixture is None:
                  raise ValueError("contracts intent fixture missing")
              path_value = expression(
                  'intents_dir / "archive" / "pr106_v11r2.json"'
              )
              load_value = expression(
                  'json.loads(self._archive_v11r2_pr106_path.read_text(encoding="utf-8"))'
              )

              def remove_fixture_assignment(attribute: str, expected_value: ast.expr) -> None:
                  matches = [
                      node for node in fixture.body
                      if isinstance(node, ast.Assign)
                      and len(node.targets) == 1
                      and isinstance(node.targets[0], ast.Attribute)
                      and isinstance(node.targets[0].value, ast.Name)
                      and node.targets[0].value.id == "self"
                      and node.targets[0].attr == attribute
                  ]
                  if len(matches) != 1 or dumped(matches[0].value) != dumped(expected_value):
                      raise ValueError(f"contracts fixture assignment mismatch: {attribute}")
                  fixture.body.remove(matches[0])

              remove_fixture_assignment("_archive_v11r2_pr106_path", path_value)
              remove_fixture_assignment("_archive_v11r2_pr106", load_value)
              candidate_contract_ids = identities(candidate_contracts)
              decision_test = candidate_contract_ids.get(
                  "TestActiveMergeIntentV5.test_active_binds_v11r1_decision_id"
              )
              locked_base_test = candidate_contract_ids.get(
                  "TestActiveMergeIntentV5.test_active_binds_locked_base_sha"
              )
              if decision_test is None or locked_base_test is None:
                  raise ValueError("contracts active identity changed")
              v14_literals = [
                  node for node in ast.walk(decision_test)
                  if isinstance(node, ast.Constant) and node.value == v14_decision
              ]
              if len(v14_literals) != 1:
                  raise ValueError("contracts v14 Decision literal mismatch")
              h0_decision_test = h0_contract_ids[
                  "TestActiveMergeIntentV5.test_active_binds_v11r1_decision_id"
              ]
              h0_literal = next(
                  node for node in ast.walk(h0_decision_test)
                  if isinstance(node, ast.Constant)
                  and node.value == "decision_20260804_restore_path_a_state_gate_current_main_v11r2"
              )
              v14_literals[0].value = h0_literal.value
              runtime_literals = [
                  node for node in ast.walk(locked_base_test)
                  if isinstance(node, ast.Constant) and node.value == runtime_base
              ]
              if len(runtime_literals) != 1:
                  raise ValueError("contracts active base literal mismatch")
              runtime_literals[0].value = historical_base
              if dumped(candidate_contracts) != dumped(h0_contracts):
                  raise ValueError("contracts module AST differs outside allowlist")

          def source_at(ref: str, path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"{ref}:{path}"]
              ).decode("utf-8")

          h0_test_sources = {
              path: source_at(h0, path) for path in semantic_test_paths
          }
          candidate_test_sources = {
              path: source_at(candidate_head, path) for path in semantic_test_paths
          }
          validate_semantic_test_sources(h0_test_sources, candidate_test_sources, b3)

          decision_bytes = blob("project_state/decision_packet.md")
          decision_text = decision_bytes.decode("utf-8")
          meta_match = re.search(
              r"\x60\x60\x60json decision_meta\s*(\{.*?\})\s*\x60\x60\x60",
              decision_text,
              re.DOTALL,
          )
          contract_match = re.search(
              r"\x60\x60\x60json decision_contract\s*(\{.*?\})\s*\x60\x60\x60",
              decision_text,
              re.DOTALL,
          )
          if meta_match is None or contract_match is None:
              raise SystemExit("candidate Decision JSON blocks missing")
          meta = json.loads(meta_match.group(1))
          contract = json.loads(contract_match.group(1))
          plan_bytes = blob("project_state/gates/command_plan.json")
          plan = json.loads(plan_bytes.decode("utf-8"))
          intent = json_blob("project_state/mainline_merge_intents/active.json")
          preflight = json_blob("project_state/gates/transition_preflight_result.json")

          expected_prior = "decision_20260804_restore_path_a_state_gate_current_main_v13"
          expected_round = "round_20260804_restore_path_a_state_gate_current_main_v13"
          if contract.get("follows_last_decision_id") != expected_prior:
              raise SystemExit("candidate Decision does not follow rejected v13")
          if contract.get("follows_last_round_id") != expected_round:
              raise SystemExit("candidate round does not follow rejected v13")
          if contract.get("previous_audit_outcome") != "V13_REJECTED_ACTIVE_BASE_ALIAS_LEAKED_INTO_HISTORICAL_ARCHIVES":
              raise SystemExit("candidate Decision does not record rejected v13 outcome")
          expected_contract = {
              "activation_base_sha": b3,
              "source_issue": 105,
              "parent_issue": 90,
              "bootstrap_issue": 111,
              "active_pr": 106,
              "required_branch": "agent/restore-path-a-state-gate-current-main-v1",
          }
          for key, expected in expected_contract.items():
              if contract.get(key) != expected:
                  raise SystemExit(f"candidate Decision {key} mismatch")
          if meta.get("status") != "APPROVED":
              raise SystemExit("candidate Decision is not APPROVED")

          false_flags = {
              "pr_creation_allowed",
              "merge_allowed",
              "mark_ready_allowed",
              "auto_merge_allowed",
              "force_push_allowed",
              "rebase_allowed",
              "release_allowed",
              "deployment_allowed",
              "real_provider_credential_allowed",
              "live_work_item_publication_allowed",
              "trusted_host_live_probe_allowed",
              "audit_generation_allowed",
          }
          for key in false_flags:
              if contract.get(key) is not False:
                  raise SystemExit(f"candidate Decision dangerous flag enabled: {key}")
          capability = contract.get("capability_policy", {})
          for key in (
              "runner_dispatch_allowed",
              "model_api_invocation_allowed",
              "external_reverse_tool_invocation_allowed",
              "unknown_binary_execution_allowed",
              "destructive_operations_allowed",
              "direct_push_to_main_allowed",
              "merge_allowed",
              "force_push_allowed",
              "rebase_during_execution_allowed",
              "tag_or_release_allowed",
          ):
              if capability.get(key) is not False:
                  raise SystemExit(f"candidate capability enabled: {key}")

          decision_sha256 = hashlib.sha256(decision_bytes).hexdigest()
          plan_sha256 = hashlib.sha256(plan_bytes).hexdigest()
          if plan.get("decision_id") != meta.get("decision_id"):
              raise SystemExit("candidate Command Plan Decision mismatch")
          if plan.get("round_id") != meta.get("round_id"):
              raise SystemExit("candidate Command Plan round mismatch")
          if intent.get("repository") != "dddd2024/reverse-agent":
              raise SystemExit("candidate Intent repository mismatch")
          if intent.get("source_pr") != 106:
              raise SystemExit("candidate Intent PR mismatch")
          if intent.get("locked_base_sha") != b3:
              raise SystemExit("candidate Intent locked base mismatch")
          if intent.get("allowed_merge_method") != "merge":
              raise SystemExit("candidate Intent merge method mismatch")
          identity = intent.get("decision_identity", {})
          if identity.get("decision_id") != meta.get("decision_id"):
              raise SystemExit("candidate Intent Decision identity mismatch")
          if identity.get("decision_content_sha256") != decision_sha256:
              raise SystemExit("candidate Intent Decision digest mismatch")
          if intent.get("command_plan_sha256") != plan_sha256:
              raise SystemExit("candidate Intent Command Plan digest mismatch")
          if preflight.get("gate_status") != "PRE_EXECUTION_AUTHORIZED":
              raise SystemExit("candidate preflight is not authorized")
          if preflight.get("decision_id") != meta.get("decision_id"):
              raise SystemExit("candidate preflight Decision mismatch")
          if preflight.get("round_id") != meta.get("round_id"):
              raise SystemExit("candidate preflight round mismatch")
          if preflight.get("blocking_reasons") != []:
              raise SystemExit("candidate preflight has blocking reasons")
          checks = preflight.get("checks")
          if not isinstance(checks, list) or not checks:
              raise SystemExit("candidate preflight checks missing")
          if any(check.get("status") != "PASS" for check in checks):
              raise SystemExit("candidate preflight contains non-PASS check")

          paths = changed_paths(b3, candidate_head)
          digest = hashlib.sha256("\n".join(paths).encode("utf-8")).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"trusted_base_sha={b3}\n")
              output.write(f"candidate_head_sha={candidate_head}\n")
              output.write(f"changed_paths_sha256={digest}\n")
          print(f"B3={b3}")
          print(f"CANDIDATE_HEAD={candidate_head}")
          print(f"changed_paths_sha256={digest}")
          PY

          collect_runs() {
            local page=1
            local page_file
            rm -f "$RUNNER_TEMP"/bootstrap-runs-page-*.json
            while :; do
              page_file="$RUNNER_TEMP/bootstrap-runs-page-$page.json"
              api_get "repos/$REPOSITORY/actions/runs?event=pull_request&branch=$EXPECTED_BRANCH&per_page=100&page=$page" > "$page_file"
              local count
              count="$(jq '.workflow_runs | length' "$page_file")"
              if [ "$count" -lt 100 ]; then
                break
              fi
              page=$((page + 1))
              test "$page" -le 20
            done
            jq -s '[.[].workflow_runs[]]' "$RUNNER_TEMP"/bootstrap-runs-page-*.json > "$RUNNER_TEMP/bootstrap-runs.json"
          }

          latest_run() {
            local workflow_name="$1"
            jq -c \
              --arg name "$workflow_name" \
              --arg branch "$EXPECTED_BRANCH" \
              '[.[] |
                select(.name == $name
                  and .event == "pull_request"
                  and .head_branch == $branch
                  and any(.pull_requests[]?; .number == 106))
               ] | sort_by(.created_at, .id) | reverse | .[0] // empty' \
              "$RUNNER_TEMP/bootstrap-runs.json"
          }

          ci_run_id=''
          preflight_run_id=''
          for attempt in $(seq 1 36); do
            collect_runs
            ci_run="$(latest_run 'CI')"
            preflight_run="$(latest_run 'Decision Preflight')"
            ready=true
            for record in "$ci_run" "$preflight_run"; do
              if [ -z "$record" ] || [ "$(jq -r '.head_sha' <<< "$record")" != "$CANDIDATE_HEAD" ]; then
                ready=false
                continue
              fi
              status="$(jq -r '.status' <<< "$record")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$record")"
              if [ "$status" = 'completed' ] && [ "$conclusion" != 'success' ]; then
                echo "latest exact-candidate workflow failed: $record" >&2
                exit 1
              fi
              if [ "$status" != 'completed' ] || [ "$conclusion" != 'success' ]; then
                ready=false
              fi
            done
            if [ "$ready" = true ]; then
              ci_run_id="$(jq -r '.id' <<< "$ci_run")"
              preflight_run_id="$(jq -r '.id' <<< "$preflight_run")"
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo 'timed out waiting for latest exact-candidate CI and Decision Preflight' >&2
              exit 1
            fi
            sleep 10
          done
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
          echo "preflight_run_id=$preflight_run_id" >> "$GITHUB_OUTPUT"

  bootstrap-candidate-tests:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.number == 106 &&
      github.repository == 'dddd2024/reverse-agent' &&
      github.event.pull_request.head.repo.full_name == 'dddd2024/reverse-agent' &&
      github.event.pull_request.head.ref == 'agent/restore-path-a-state-gate-current-main-v1' &&
      github.event.pull_request.base.repo.full_name == 'dddd2024/reverse-agent' &&
      github.event.pull_request.base.ref == 'main'
    needs: bootstrap-authority
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bootstrap-authority.outputs.candidate_head_sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ""

      - name: Remove ambient Git credential helpers
        shell: bash
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local credential.helper ''
          rm -f "$HOME/.git-credentials"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install exact candidate test dependencies
        run: python -m pip install -e ".[test]"

      - name: Validate exact B3 to candidate diff
        env:
          CANDIDATE_BASE_SHA: ${{ needs.bootstrap-authority.outputs.trusted_base_sha }}
        run: git diff --check "$CANDIDATE_BASE_SHA"..HEAD

      - name: Trusted authority tests
        run: python -m pytest tests/platform_v1/test_trusted_live_launcher.py tests/platform_v1/test_authority_adapter.py tests/platform_v1/test_cli.py tests/platform_v1/test_evidence_adapter.py tests/platform_v1/test_contracts.py tests/platform_v1/test_merge_intent.py -q

      - name: Read-only surface tests
        run: python -m pytest tests/test_github_workflow_identity.py tests/test_mainline_landing.py tests/platform_v1/test_github_adapter.py -q

      - name: Path-A gate tests
        run: python -m pytest tests/test_path_a_gate.py tests/test_control_plane_transition.py tests/test_planning_and_github_adapters.py -q

      - name: Project gate tests
        run: python -m pytest tests/test_project_gate.py -q

      - name: Mainline landing tests
        run: python -m pytest tests/test_mainline_landing.py tests/test_integration_baseline.py tests/test_project_audits.py -q

      - name: Platform V1 tests
        run: python -m pytest tests/platform_v1 -q

      - name: Minimal baseline documentation tests
        run: python -m pytest tests/test_minimal_integration_baseline_docs.py -q

      - name: Supervisor and repository hygiene tests
        run: python -m pytest tests/test_supervisor_validate.py tests/test_repository_hygiene.py -q

  bootstrap-receipt:
    if: >-
      always() &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.number == 106 &&
      github.repository == 'dddd2024/reverse-agent' &&
      github.event.pull_request.head.repo.full_name == 'dddd2024/reverse-agent' &&
      github.event.pull_request.head.ref == 'agent/restore-path-a-state-gate-current-main-v1' &&
      github.event.pull_request.base.repo.full_name == 'dddd2024/reverse-agent' &&
      github.event.pull_request.base.ref == 'main'
    needs: [bootstrap-authority, bootstrap-candidate-tests]
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate trusted Bootstrap receipt
        shell: bash
        env:
          AUTHORITY_JOB_RESULT: ${{ needs.bootstrap-authority.result }}
          CANDIDATE_JOB_RESULT: ${{ needs.bootstrap-candidate-tests.result }}
          TRUSTED_BASE_SHA: ${{ needs.bootstrap-authority.outputs.trusted_base_sha }}
          CANDIDATE_HEAD_SHA: ${{ needs.bootstrap-authority.outputs.candidate_head_sha }}
          OBSERVED_CHANGED_PATHS_SHA256: ${{ needs.bootstrap-authority.outputs.changed_paths_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone

          b3 = os.environ.get("TRUSTED_BASE_SHA", "")
          candidate_head = os.environ.get("CANDIDATE_HEAD_SHA", "")
          observed_digest = os.environ.get("OBSERVED_CHANGED_PATHS_SHA256", "")
          authority_result = (
              "SUCCESS"
              if os.environ.get("AUTHORITY_JOB_RESULT") == "success"
              and len(b3) == 40
              and len(candidate_head) == 40
              and len(observed_digest) == 64
              else "FAILED"
          )
          candidate_result = (
              "SUCCESS"
              if os.environ.get("CANDIDATE_JOB_RESULT") == "success"
              else "FAILED"
          )
          final_result = (
              "PASS"
              if authority_result == "SUCCESS" and candidate_result == "SUCCESS"
              else "BLOCKED"
          )
          receipt = {
              "schema_version": "0.1",
              "receipt_kind": "state_gate",
              "repository": "dddd2024/reverse-agent",
              "pr_number": 106,
              "workflow_path": ".github/workflows/state-gate.yml",
              "workflow_event": "pull_request_target",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
              "trusted_base_sha": b3,
              "trusted_verifier_tree_sha": b3,
              "candidate_head_sha": candidate_head,
              "candidate_base_sha": b3,
              "changed_paths_sha256": observed_digest,
              "selected_mode": "transition",
              "authority_identity": "trusted_base_verifier",
              "authority_revision": b3,
              "authority_result": authority_result,
              "candidate_tests_result": candidate_result,
              "final_gate_result": final_result,
              "generated_at": datetime.now(timezone.utc).isoformat(),
          }
          canonical = json.dumps(
              receipt,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          receipt["content_sha256"] = hashlib.sha256(canonical).hexdigest()
          output = os.path.join(os.environ["RUNNER_TEMP"], "state_gate_receipt.json")
          with open(output, "w", encoding="utf-8") as stream:
              json.dump(receipt, stream, indent=2, sort_keys=True)
              stream.write("\n")
          print(f"final_gate_result={final_result}")
          PY

      - name: Upload the only Bootstrap receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-gate-receipt-pr106-${{ needs.bootstrap-authority.outputs.candidate_head_sha }}
          path: ${{ runner.temp }}/state_gate_receipt.json
          if-no-files-found: error

      - name: Enforce trusted Bootstrap receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os

          path = os.path.join(os.environ["RUNNER_TEMP"], "state_gate_receipt.json")
          with open(path, encoding="utf-8") as stream:
              receipt = json.load(stream)
          content_sha256 = receipt.pop("content_sha256", "")
          canonical = json.dumps(
              receipt,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          if hashlib.sha256(canonical).hexdigest() != content_sha256:
              raise SystemExit("receipt content digest mismatch")
          if receipt.get("authority_result") != "SUCCESS":
              raise SystemExit("Bootstrap authority did not succeed")
          if receipt.get("candidate_tests_result") != "SUCCESS":
              raise SystemExit("Bootstrap candidate tests did not succeed")
          if receipt.get("final_gate_result") != "PASS":
              raise SystemExit("Bootstrap receipt did not pass")
          PY
