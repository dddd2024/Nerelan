name: BRAND-2B v31 materialize prevalidated blobs

on:
  push:
    branches:
      - owner/issue530-brand2b-prevalidation-r3-v31

permissions:
  contents: write

jobs:
  materialize-blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact v31 head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Rebuild exact prevalidated schema-v4 contract files
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "owner/issue530-brand2b-prevalidation-r3-v31"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "0da78df5d2c5337ffeab17e3a00651df507637f0"
          git diff --exit-code 8e00110583bb7f17f79ef3d8baa110bef6c5429d HEAD -- project_state/decision_packet.md
          git restore --source=origin/main --worktree --staged -- \
            tests/platform_v1/test_contracts.py \
            tests/platform_v1/test_merge_intent.py
          python - <<'PY'
          from pathlib import Path

          rel = "tests/platform_v1/test_contracts.py"
          p = Path(rel)
          s = p.read_text(encoding="utf-8")
          assert s.count("SUPPORTED_ACTIVE_SCHEMA_VERSIONS = (1, 2, 3)") == 1
          s = s.replace("SUPPORTED_ACTIVE_SCHEMA_VERSIONS = (1, 2, 3)", "SUPPORTED_ACTIVE_SCHEMA_VERSIONS = (1, 2, 3, 4)")
          needle = 'if schema_version == 3:\n        return list(resolve_premerge_workflow_profile(active["workflow_profile"]))'
          assert s.count(needle) == 1
          s = s.replace(needle, 'if schema_version in {3, 4}:\n        return list(resolve_premerge_workflow_profile(active["workflow_profile"]))')
          assert s.count('assert self._active["schema_version"] == 3') == 5
          s = s.replace('assert self._active["schema_version"] == 3', 'assert self._active["schema_version"] == 4')
          assert s.count('for schema_version in (4, 5, "3", None, False):') == 1
          s = s.replace('for schema_version in (4, 5, "3", None, False):', 'for schema_version in (5, "3", None, False):', 1)
          p.write_text(s, encoding="utf-8")

          rel = "tests/platform_v1/test_merge_intent.py"
          p = Path(rel)
          s = p.read_text(encoding="utf-8")
          needle = 'if schema_version == 3:\n        return list(resolve_premerge_workflow_profile(intent["workflow_profile"]))'
          assert s.count(needle) == 1
          s = s.replace(needle, 'if schema_version in {3, 4}:\n        return list(resolve_premerge_workflow_profile(intent["workflow_profile"]))')
          assert s.count('assert data["schema_version"] in {1, 2, 3}') == 2
          s = s.replace('assert data["schema_version"] in {1, 2, 3}', 'assert data["schema_version"] in {1, 2, 3, 4}')
          assert s.count('for schema_version in (4, 5, "3", None, False):') == 1
          s = s.replace('for schema_version in (4, 5, "3", None, False):', 'for schema_version in (5, "3", None, False):', 1)
          p.write_text(s, encoding="utf-8")
          PY
          python -m py_compile tests/platform_v1/test_contracts.py tests/platform_v1/test_merge_intent.py
          git diff --check

      - name: Require exact Git blob identities and upload only blobs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          targets = {
              "tests/platform_v1/test_contracts.py": "ccdd40dc153f88dc4c92baa81324ad94f98f9dc7",
              "tests/platform_v1/test_merge_intent.py": "84ade4d86682c7b2eeb3c49f7673290b77690475",
          }
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          for path, expected in targets.items():
              data = Path(path).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode("ascii") + data).hexdigest()
              if actual != expected:
                  raise SystemExit(f"local_blob_sha_mismatch:{path}:{actual}:{expected}")
              payload = json.dumps({
                  "content": base64.b64encode(data).decode("ascii"),
                  "encoding": "base64",
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs",
                  data=payload,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)
              if result.get("sha") != expected:
                  raise SystemExit(f"remote_blob_sha_mismatch:{path}:{result.get('sha')}:{expected}")
              print(f"uploaded {path} {expected}")
          PY

      - name: Prove helper did not commit or push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "only unreferenced Git blobs were uploaded; no commit or push was performed"
