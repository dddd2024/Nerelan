[package]
name = "nerelan-desktop"
version = "0.1.0"
description = "Nerelan desktop shell - Tauri 2 native runtime bridge"
license = "MIT"
repository = "https://github.com/dddd2024/Nerelan"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nerelan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
