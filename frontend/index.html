<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nerelan-app-icon.svg" />
    <meta name="application-name" content="Nerelan" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nerelan — 平台 V1 控制台</title>
    <script>
      (() => {
        try {
          const key = "nerelan.appearance";
          const legacyKey = "reverse-agent.appearance";
          const current = localStorage.getItem(key);
          const legacy = current === null ? localStorage.getItem(legacyKey) : null;
          const raw = current ?? legacy;
          const saved = JSON.parse(raw || "null");
          const modes = ["system", "light", "dark"];
          const accents = ["cyan", "blue", "violet", "amber", "rose"];

          if (current === null && legacy !== null) {
            localStorage.setItem(key, JSON.stringify({
              mode: modes.includes(saved?.mode) ? saved.mode : "system",
              accent: accents.includes(saved?.accent) ? saved.accent : "cyan",
            }));
            localStorage.removeItem(legacyKey);
          }

          document.documentElement.dataset.theme = modes.includes(saved?.mode) ? saved.mode : "system";
          document.documentElement.dataset.accent = accents.includes(saved?.accent) ? saved.accent : "cyan";
        } catch {
          document.documentElement.dataset.theme = "system";
          document.documentElement.dataset.accent = "cyan";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.client.tsx"></script>
  </body>
</html>
